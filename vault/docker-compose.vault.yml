# Garcar Enterprise — local HashiCorp Vault (dev / bootstrap)
# Production: use HCP Vault or self-hosted HA. Do not use dev mode in prod.
#
#   docker compose -f vault/docker-compose.vault.yml up -d
#   export VAULT_ADDR=http://127.0.0.1:8200
#   export VAULT_TOKEN=garcar-root-dev-token
#   bash vault/hashicorp/bootstrap.sh
#   # fill vault/.vault.env then:
#   python vault/hashicorp/seed_from_env.py
#   python vault/hashicorp/sync_to_github.py

services:
  vault:
    image: hashicorp/vault:1.17
    container_name: garcar-vault
    ports:
      - "8200:8200"
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: garcar-root-dev-token
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
      VAULT_ADDR: http://127.0.0.1:8200
    cap_add:
      - IPC_LOCK
    command: server -dev -dev-root-token-id=garcar-root-dev-token
    healthcheck:
      test: ["CMD", "vault", "status", "-address=http://127.0.0.1:8200"]
      interval: 5s
      timeout: 3s
      retries: 10
