name: Garcar Master Autokey Propagator
# ONE workflow. ONE run. ALL core repos get ALL secrets.
# Add secrets to systems-master-hub ONLY, then run this.
# Full inventory: Cloudflare, Notion, SendGrid, Pixel10, Stripe, OpenAI, Perplexity, Railway, etc.
# Aligned with SuperSecret local vault pattern.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type PROPAGATE to confirm'
        required: true
        type: string
      dry_run:
        description: 'Set to true for inventory-only (no writes)'
        required: false
        default: 'false'
        type: string

jobs:
  propagate:
    runs-on: ubuntu-latest
    if: inputs.confirm == 'PROPAGATE'
    steps:
      - uses: actions/checkout@v4

      # ── Validate required secrets ────────────────────────────────────────
      - name: Validate master secrets
        env:
          GHPAT: ${{ secrets.GHPAT }}
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GC_PAT_DISPATCH: ${{ secrets.GC_PAT_DISPATCH }}
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
          PIXEL10_IP: ${{ secrets.PIXEL10_IP }}
          PIXEL10_SSH_KEY: ${{ secrets.PIXEL10_SSH_KEY }}
          PIXEL10_SSH_PORT: ${{ secrets.PIXEL10_SSH_PORT }}
        run: |
          MISSING=""
          [ -z "$GHPAT" ]                  && MISSING="$MISSING GHPAT"
          [ -z "$RAILWAY_TOKEN" ]           && MISSING="$MISSING RAILWAY_TOKEN"
          [ -z "$STRIPE_SECRET_KEY" ]       && MISSING="$MISSING STRIPE_SECRET_KEY"
          [ -z "$OPENAI_API_KEY" ]          && MISSING="$MISSING OPENAI_API_KEY"
          if [ -n "$MISSING" ]; then
            echo "❌ Critical secrets missing:$MISSING"
            echo "Add at: https://github.com/Garrettc123/systems-master-hub/settings/secrets/actions"
            echo "Or vault locally: secret set <NAME>"
            exit 1
          fi
          echo "✅ Critical secrets present"
          echo ""
          echo "Full inventory status:"
          [ -n "$STRIPE_WEBHOOK_SECRET" ]  && echo "  ✓ STRIPE_WEBHOOK_SECRET" || echo "  ○ STRIPE_WEBHOOK_SECRET"
          [ -n "$PERPLEXITY_API_KEY" ]     && echo "  ✓ PERPLEXITY_API_KEY" || echo "  ○ PERPLEXITY_API_KEY"
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ]  && echo "  ✓ CLOUDFLARE_ACCOUNT_ID" || echo "  ○ CLOUDFLARE_ACCOUNT_ID"
          [ -n "$CLOUDFLARE_API_TOKEN" ]   && echo "  ✓ CLOUDFLARE_API_TOKEN" || echo "  ○ CLOUDFLARE_API_TOKEN"
          [ -n "$GC_PAT_DISPATCH" ]        && echo "  ✓ GC_PAT_DISPATCH" || echo "  ○ GC_PAT_DISPATCH"
          [ -n "$NOTION_API_KEY" ]         && echo "  ✓ NOTION_API_KEY" || echo "  ○ NOTION_API_KEY"
          [ -n "$SENDGRID_API_KEY" ]       && echo "  ✓ SENDGRID_API_KEY" || echo "  ○ SENDGRID_API_KEY"
          [ -n "$PIXEL10_IP" ]             && echo "  ✓ PIXEL10_IP" || echo "  ○ PIXEL10_IP"
          [ -n "$PIXEL10_SSH_KEY" ]        && echo "  ✓ PIXEL10_SSH_KEY" || echo "  ○ PIXEL10_SSH_KEY"
          [ -n "$PIXEL10_SSH_PORT" ]       && echo "  ✓ PIXEL10_SSH_PORT" || echo "  ○ PIXEL10_SSH_PORT"

      # ── Report extended key presence ─────────────────────────────────────
      - name: Extended key status
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          HUBSPOT_API_KEY: ${{ secrets.HUBSPOT_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          APOLLO_API_KEY: ${{ secrets.APOLLO_API_KEY }}
          STRIPE_PUBLISHABLE_KEY: ${{ secrets.STRIPE_PUBLISHABLE_KEY }}
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
        run: |
          echo "Additional substrate keys:"
          [ -n "$APOLLO_API_KEY" ]         && echo "  ✓ APOLLO_API_KEY" || echo "  ○ APOLLO_API_KEY"
          [ -n "$STRIPE_PUBLISHABLE_KEY" ] && echo "  ✓ STRIPE_PUBLISHABLE_KEY" || echo "  ○ STRIPE_PUBLISHABLE_KEY"
          [ -n "$ANTHROPIC_API_KEY" ]      && echo "  ✓ ANTHROPIC_API_KEY" || echo "  ○ ANTHROPIC_API_KEY"
          [ -n "$GEMINI_API_KEY" ]         && echo "  ✓ GEMINI_API_KEY" || echo "  ○ GEMINI_API_KEY"
          [ -n "$GOOGLE_API_KEY" ]         && echo "  ✓ GOOGLE_API_KEY" || echo "  ○ GOOGLE_API_KEY"
          [ -n "$HUBSPOT_API_KEY" ]        && echo "  ✓ HUBSPOT_API_KEY" || echo "  ○ HUBSPOT_API_KEY"
          [ -n "$SUPABASE_URL" ]           && echo "  ✓ SUPABASE_URL" || echo "  ○ SUPABASE_URL"
          [ -n "$SUPABASE_SERVICE_KEY" ]   && echo "  ✓ SUPABASE_SERVICE_KEY" || echo "  ○ SUPABASE_SERVICE_KEY"
          [ -n "$LINEAR_API_KEY" ]         && echo "  ✓ LINEAR_API_KEY" || echo "  ○ LINEAR_API_KEY"

      # ── Install gh CLI ───────────────────────────────────────────────────
      - name: Install gh CLI
        run: |
          curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg \
            | sudo dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" \
            | sudo tee /etc/apt/sources.list.d/github-cli.list
          sudo apt-get update -qq && sudo apt-get install -y gh
          echo "✅ gh CLI ready"

      # ── Push ALL secrets to full empire ──────────────────────────────────
      - name: Propagate secrets to full Garcar empire
        env:
          GHPAT: ${{ secrets.GHPAT }}
          GC_PAT_DISPATCH: ${{ secrets.GC_PAT_DISPATCH }}
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          STRIPE_PUBLISHABLE_KEY: ${{ secrets.STRIPE_PUBLISHABLE_KEY }}
          STRIPE_PRICE_STARTER: ${{ secrets.STRIPE_PRICE_STARTER }}
          STRIPE_PRICE_PRO: ${{ secrets.STRIPE_PRICE_PRO }}
          STRIPE_PRICE_AGENCY: ${{ secrets.STRIPE_PRICE_AGENCY }}
          APOLLO_API_KEY: ${{ secrets.APOLLO_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
          HUBSPOT_API_KEY: ${{ secrets.HUBSPOT_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
          APP_BASE_URL_PAYMENTS: ${{ secrets.APP_BASE_URL_PAYMENTS }}
          APP_BASE_URL_RHNS: ${{ secrets.APP_BASE_URL_RHNS }}
          APP_BASE_URL_ATLAS: ${{ secrets.APP_BASE_URL_ATLAS }}
          APP_BASE_URL_ZEUS: ${{ secrets.APP_BASE_URL_ZEUS }}
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
          PIXEL10_IP: ${{ secrets.PIXEL10_IP }}
          PIXEL10_SSH_KEY: ${{ secrets.PIXEL10_SSH_KEY }}
          PIXEL10_SSH_PORT: ${{ secrets.PIXEL10_SSH_PORT }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          export GH_TOKEN="$GHPAT"

          set_secret() {
            local REPO="$1" NAME="$2" VALUE="$3"
            if [ -n "$VALUE" ]; then
              if [ "$DRY_RUN" = "true" ]; then
                echo "  [dry-run] would set $NAME → $REPO"
              else
                gh secret set "$NAME" --body "$VALUE" --repo "Garrettc123/$REPO" && echo "  ✓ $NAME → $REPO"
              fi
            else
              echo "  ○ $NAME skipped (not set) → $REPO"
            fi
          }

          TARGETS=(
            systems-master-hub
            garcar-payments
            garcar-rhns-core
            atlas-dashboard
            zeus-dashboard
            garcar-autonomous-wealth-system
            TITAN-Autonomous-Business-Empire
            autonomous-butler-core
            enterprise-mlops-platform
            neural-mesh
            ai-ops-studio
            ai-business-automation-tree
            garcar-payment-loop
            mars-api
          )

          for REPO in "${TARGETS[@]}"; do
            echo ""
            echo "━━ $REPO ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

            # GitHub / Dispatch
            set_secret "$REPO" "GHPAT"                  "$GHPAT"
            set_secret "$REPO" "GC_PAT_DISPATCH"         "$GC_PAT_DISPATCH"

            # Infrastructure
            set_secret "$REPO" "RAILWAY_TOKEN"           "$RAILWAY_TOKEN"
            set_secret "$REPO" "LINEAR_API_KEY"          "$LINEAR_API_KEY"
            set_secret "$REPO" "SLACK_WEBHOOK_URL"       "$SLACK_WEBHOOK_URL"

            # Cloudflare
            set_secret "$REPO" "CLOUDFLARE_ACCOUNT_ID"   "$CLOUDFLARE_ACCOUNT_ID"
            set_secret "$REPO" "CLOUDFLARE_API_TOKEN"    "$CLOUDFLARE_API_TOKEN"

            # Stripe
            set_secret "$REPO" "STRIPE_SECRET_KEY"       "$STRIPE_SECRET_KEY"
            set_secret "$REPO" "STRIPE_WEBHOOK_SECRET"   "$STRIPE_WEBHOOK_SECRET"
            set_secret "$REPO" "STRIPE_PUBLISHABLE_KEY"  "$STRIPE_PUBLISHABLE_KEY"
            set_secret "$REPO" "STRIPE_PRICE_STARTER"    "$STRIPE_PRICE_STARTER"
            set_secret "$REPO" "STRIPE_PRICE_PRO"        "$STRIPE_PRICE_PRO"
            set_secret "$REPO" "STRIPE_PRICE_AGENCY"     "$STRIPE_PRICE_AGENCY"

            # AI / Multi-model
            set_secret "$REPO" "OPENAI_API_KEY"          "$OPENAI_API_KEY"
            set_secret "$REPO" "ANTHROPIC_API_KEY"       "$ANTHROPIC_API_KEY"
            set_secret "$REPO" "GEMINI_API_KEY"          "$GEMINI_API_KEY"
            set_secret "$REPO" "GOOGLE_API_KEY"          "$GOOGLE_API_KEY"
            set_secret "$REPO" "PERPLEXITY_API_KEY"      "$PERPLEXITY_API_KEY"

            # CRM / Productivity
            set_secret "$REPO" "HUBSPOT_API_KEY"         "$HUBSPOT_API_KEY"
            set_secret "$REPO" "NOTION_API_KEY"          "$NOTION_API_KEY"
            set_secret "$REPO" "SENDGRID_API_KEY"        "$SENDGRID_API_KEY"

            # Data
            set_secret "$REPO" "SUPABASE_URL"            "$SUPABASE_URL"
            set_secret "$REPO" "SUPABASE_ANON_KEY"       "$SUPABASE_ANON_KEY"
            set_secret "$REPO" "SUPABASE_SERVICE_KEY"    "$SUPABASE_SERVICE_KEY"
            set_secret "$REPO" "DATABASE_URL"            "$DATABASE_URL"
            set_secret "$REPO" "REDIS_URL"               "$REDIS_URL"

            # Revenue
            set_secret "$REPO" "APOLLO_API_KEY"          "$APOLLO_API_KEY"

            # Pixel10 edge node
            set_secret "$REPO" "PIXEL10_IP"              "$PIXEL10_IP"
            set_secret "$REPO" "PIXEL10_SSH_KEY"         "$PIXEL10_SSH_KEY"
            set_secret "$REPO" "PIXEL10_SSH_PORT"        "$PIXEL10_SSH_PORT"
          done

          # Repo-specific APP_BASE_URL
          set_secret "garcar-payments"  "APP_BASE_URL" "$APP_BASE_URL_PAYMENTS"
          set_secret "garcar-rhns-core" "APP_BASE_URL" "$APP_BASE_URL_RHNS"
          set_secret "atlas-dashboard"  "APP_BASE_URL" "$APP_BASE_URL_ATLAS"
          set_secret "zeus-dashboard"   "APP_BASE_URL" "$APP_BASE_URL_ZEUS"

          # Frontend
          for REPO in atlas-dashboard zeus-dashboard; do
            set_secret "$REPO" "VERCEL_TOKEN"        "$VERCEL_TOKEN"
            set_secret "$REPO" "NEXT_PUBLIC_APP_URL" "$NEXT_PUBLIC_APP_URL"
          done

          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          if [ "$DRY_RUN" = "true" ]; then
            echo " ✅ DRY-RUN COMPLETE — no secrets written"
          else
            echo " ✅ ALL SECRETS PROPAGATED TO GARCAR EMPIRE"
          fi
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

      # ── Trigger deploys ──────────────────────────────────────────────────
      - name: Trigger deploys
        if: inputs.dry_run != 'true'
        env:
          GHPAT: ${{ secrets.GHPAT }}
        run: |
          export GH_TOKEN="$GHPAT"
          for REPO in garcar-payments garcar-rhns-core atlas-dashboard zeus-dashboard; do
            gh workflow run deploy.yml --repo "Garrettc123/$REPO" --ref main 2>/dev/null \
              && echo "  ✓ deploy triggered: $REPO" \
              || echo "  ○ no deploy.yml yet: $REPO"
          done

      # ── Final report ────────────────────────────────────────────────────
      - name: Report
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo " GARCAR AUTOKEY COMPLETE"
          echo ""
          echo " Implemented secrets:"
          echo "   CLOUDFLARE_ACCOUNT_ID | CLOUDFLARE_API_TOKEN"
          echo "   GC_PAT_DISPATCH"
          echo "   NOTION_API_KEY | SENDGRID_API_KEY"
          echo "   OPENAI_API_KEY | PERPLEXITY_API_KEY"
          echo "   PIXEL10_IP | PIXEL10_SSH_KEY | PIXEL10_SSH_PORT"
          echo "   RAILWAY_TOKEN"
          echo "   STRIPE_SECRET_KEY | STRIPE_WEBHOOK_SECRET"
          echo ""
          echo " + full existing stack (Apollo, HubSpot, Supabase, etc.)"
          echo ""
          echo " Local SuperSecret:"
          echo "   secret set CLOUDFLARE_ACCOUNT_ID"
          echo "   secret set CLOUDFLARE_API_TOKEN"
          echo "   secret set GC_PAT_DISPATCH"
          echo "   secret set NOTION_API_KEY"
          echo "   secret set SENDGRID_API_KEY"
          echo "   secret set PIXEL10_IP"
          echo "   secret set PIXEL10_SSH_KEY"
          echo "   secret set PIXEL10_SSH_PORT"
          echo ""
          echo " Then re-run this workflow with PROPAGATE"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
