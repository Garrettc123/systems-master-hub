name: Garcar autonomous wiring

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "dry_run = validate registry only; live = open draft wiring PRs (needs PAT secret)"
        required: true
        default: dry_run
        type: choice
        options:
          - dry_run
          - live

permissions:
  contents: read

jobs:
  wire-tier1:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout hub
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install requests

      - name: Compile check
        run: python -m py_compile orchestrate/autonomous_wiring.py

      - name: Dry run (no secret required)
        if: ${{ inputs.mode == 'dry_run' }}
        env:
          DRY_RUN: "1"
        run: python orchestrate/autonomous_wiring.py

      - name: Live wiring (draft PRs)
        if: ${{ inputs.mode == 'live' }}
        env:
          GARCAR_ORCHESTRATOR_TOKEN: ${{ secrets.GARCAR_ORCHESTRATOR_TOKEN }}
        run: |
          if [ -z "$GARCAR_ORCHESTRATOR_TOKEN" ]; then
            echo "Live mode needs Actions secret GARCAR_ORCHESTRATOR_TOKEN (PAT with repo scope)."
            echo "Set it at: Settings → Secrets and variables → Actions"
            echo "Meanwhile Os can fan out via the GitHub connector without this secret."
            exit 1
          fi
          python orchestrate/autonomous_wiring.py
