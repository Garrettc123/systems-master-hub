# ═══════════════════════════════════════════════════════════════════════
# GARCAR APEX — Daily Evolution Engine
# Fires at 6AM UTC every day. Evolves all 20 registered systems in
# parallel. Each system gets exactly one new capability per day.
# Rule: Never repeat. Only upgrade. Converge to mastery.
# ═══════════════════════════════════════════════════════════════════════

name: 🧬 GARCAR Daily Evolution Engine

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      target_system:
        description: 'Evolve a specific system (leave blank for all 20)'
        required: false
        default: ''
      dry_run:
        description: 'Dry run — preview without writing'
        type: boolean
        default: false

env:
  GARCAR_ORG: Garrettc123
  REGISTRY_URL: https://raw.githubusercontent.com/Garrettc123/systems-master-hub/main/registry/capability-registry.json

jobs:

  assess:
    name: 🔍 Ecosystem Assessment
    runs-on: ubuntu-latest
    outputs:
      evolution_matrix: ${{ steps.scan.outputs.matrix }}
      total_systems: ${{ steps.scan.outputs.count }}
    steps:
      - uses: actions/checkout@v4

      - name: Build evolution matrix from registry
        id: scan
        run: |
          python3 << 'EOF'
          import json, urllib.request, os

          with urllib.request.urlopen(os.environ['REGISTRY_URL'], timeout=15) as r:
              registry = json.loads(r.read())

          systems = sorted(registry.get('systems', {}).keys())
          target = "${{ github.event.inputs.target_system }}"
          if target:
              systems = [s for s in systems if s == target]

          matrix = {"include": [{"system": s} for s in systems]}
          print(f"::set-output name=matrix::{json.dumps(matrix)}")
          print(f"::set-output name=count::{len(systems)}")
          print(f"\n🎯 Evolution targets: {len(systems)} systems")
          for s in systems:
              data = registry['systems'][s]
              print(f"  → {s}: {data.get('maturity_score', 0)}% mature | missing: {len(data.get('capabilities_missing', []))} capabilities")
          EOF

  evolve:
    name: 🧬 Evolve ${{ matrix.system }}
    needs: assess
    runs-on: ubuntu-latest
    if: needs.assess.outputs.total_systems > 0
    strategy:
      matrix: ${{ fromJson(needs.assess.outputs.evolution_matrix) }}
      max-parallel: 20
      fail-fast: false
    steps:
      - name: Checkout systems-master-hub
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GARCAR_PAT || secrets.GITHUB_TOKEN }}

      - name: Checkout target system
        uses: actions/checkout@v4
        with:
          repository: ${{ env.GARCAR_ORG }}/${{ matrix.system }}
          token: ${{ secrets.GARCAR_PAT || secrets.GITHUB_TOKEN }}
          path: target-system
          fetch-depth: 1
        continue-on-error: true

      - name: Run GARCAR Evolution Agent
        run: |
          DRY=""
          [ "${{ github.event.inputs.dry_run }}" = "true" ] && DRY="--dry-run"
          python3 .garcar/evolve.py \
            --system "${{ matrix.system }}" \
            --path ./target-system \
            --registry "${{ env.REGISTRY_URL }}" \
            --log-to . \
            $DRY

      - name: Commit evolved system
        if: github.event.inputs.dry_run != 'true'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          repository: ./target-system
          commit_message: "🧬 auto-evolve: ${{ matrix.system }} +capability $(date +%Y-%m-%d)"
          commit_user_name: "GARCAR Evolution Agent"
          commit_user_email: "apex@garcar.ai"
        continue-on-error: true

  report:
    name: 📊 Evolution Report
    needs: [assess, evolve]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GARCAR_PAT || secrets.GITHUB_TOKEN }}

      - name: Append master evolution summary
        run: |
          DATE=$(date +%Y-%m-%d)
          echo "" >> DAILY_EVOLUTION_LOG.md
          echo "# 🧬 GARCAR Evolution Report — $DATE" >> DAILY_EVOLUTION_LOG.md
          echo "**Systems evolved:** ${{ needs.assess.outputs.total_systems }}" >> DAILY_EVOLUTION_LOG.md
          echo "**Workflow run:** ${{ github.run_id }}" >> DAILY_EVOLUTION_LOG.md
          echo "**Rule:** Never repeat. Only upgrade. Converge to mastery." >> DAILY_EVOLUTION_LOG.md
          echo "---" >> DAILY_EVOLUTION_LOG.md

      - name: Commit evolution log
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "📊 evolution-log: daily report $(date +%Y-%m-%d)"
          commit_user_name: "GARCAR Evolution Agent"
          commit_user_email: "apex@garcar.ai"
        continue-on-error: true

      - name: Ping ATLAS dashboard
        run: |
          curl -sf -X POST \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${{ secrets.GARCAR_INTERNAL_TOKEN }}" \
            -d '{"event":"evolution.cycle.completed","date":"'$(date +%Y-%m-%d)'","systems_evolved":${{ needs.assess.outputs.total_systems }}}' \
            https://atlas-dashboard.vercel.app/api/events || echo "ATLAS ping skipped (deploy pending)"
