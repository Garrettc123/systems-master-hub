name: Garcar Vault GitHub Sync

on:
  schedule:
    # Every 6 hours — keep GitHub distribution plane aligned with Vault
    - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'sync | rotate_and_sync | dry_run'
        required: true
        default: 'sync'
        type: choice
        options:
          - sync
          - rotate_and_sync
          - dry_run

permissions:
  contents: read

concurrency:
  group: garcar-vault-sync
  cancel-in-progress: false

jobs:
  vault-e2e:
    name: Vault → GitHub (zero-touch)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install vault client deps
        run: pip install -r vault/hashicorp/requirements.txt

      - name: Check Vault credentials
        id: vault
        env:
          VAULT_ADDR: ${{ secrets.VAULT_ADDR }}
          VAULT_TOKEN: ${{ secrets.VAULT_TOKEN }}
          VAULT_ROLE_ID: ${{ secrets.VAULT_ROLE_ID }}
          VAULT_SECRET_ID: ${{ secrets.VAULT_SECRET_ID }}
        run: |
          set -euo pipefail
          if [ -z "${VAULT_ADDR:-}" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "VAULT_ADDR not set — soft-skip (bootstrap Vault first)"
            exit 0
          fi
          if [ -z "${VAULT_TOKEN:-}" ] && { [ -z "${VAULT_ROLE_ID:-}" ] || [ -z "${VAULT_SECRET_ID:-}" ]; }; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Need VAULT_TOKEN or VAULT_ROLE_ID+VAULT_SECRET_ID"
            exit 0
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Health check Vault
        if: steps.vault.outputs.ready == 'true'
        env:
          VAULT_ADDR: ${{ secrets.VAULT_ADDR }}
          VAULT_TOKEN: ${{ secrets.VAULT_TOKEN }}
          VAULT_ROLE_ID: ${{ secrets.VAULT_ROLE_ID }}
          VAULT_SECRET_ID: ${{ secrets.VAULT_SECRET_ID }}
        working-directory: vault/hashicorp
        run: python client.py

      - name: Rotate internal secrets
        if: steps.vault.outputs.ready == 'true' && (github.event.inputs.mode == 'rotate_and_sync' || github.event_name == 'schedule')
        env:
          VAULT_ADDR: ${{ secrets.VAULT_ADDR }}
          VAULT_TOKEN: ${{ secrets.VAULT_TOKEN }}
          VAULT_ROLE_ID: ${{ secrets.VAULT_ROLE_ID }}
          VAULT_SECRET_ID: ${{ secrets.VAULT_SECRET_ID }}
        working-directory: vault/hashicorp
        run: python rotate_internal.py

      - name: Sync Vault → GitHub (all repos / all keys)
        if: steps.vault.outputs.ready == 'true'
        env:
          VAULT_ADDR: ${{ secrets.VAULT_ADDR }}
          VAULT_TOKEN: ${{ secrets.VAULT_TOKEN }}
          VAULT_ROLE_ID: ${{ secrets.VAULT_ROLE_ID }}
          VAULT_SECRET_ID: ${{ secrets.VAULT_SECRET_ID }}
          GHPAT: ${{ secrets.GHPAT || secrets.PAT_TOKEN }}
          GH_TOKEN: ${{ secrets.GHPAT || secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
          DRY_RUN: ${{ github.event.inputs.mode == 'dry_run' && '1' || '0' }}
          GITHUB_ORG: Garrettc123
        working-directory: vault/hashicorp
        run: python sync_to_github.py

      - name: Summary
        run: |
          if [ "${{ steps.vault.outputs.ready }}" = "true" ]; then
            echo "Vault E2E finished mode=${{ github.event.inputs.mode || 'schedule' }}"
          else
            echo "Vault E2E soft-skipped — set VAULT_ADDR + AppRole (or token) once, then re-run."
          fi
