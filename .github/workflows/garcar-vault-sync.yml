name: Garcar Vault GitHub Sync

on:
  # Scheduled runs only distribute Vault's current values. They must never
  # ingest GitHub values or rotate internal credentials implicitly.
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'sync is the safe default; ingest/full/rotate are explicit maintenance actions'
        required: true
        default: 'sync'
        type: choice
        options:
          - sync
          - dry_run
          - ingest
          - ensure
          - rotate
          - full
          - github_only

permissions:
  contents: read

concurrency:
  group: garcar-vault-sync
  cancel-in-progress: false

jobs:
  zero-touch:
    name: Vault secret distribution
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: vault/hashicorp/requirements.txt

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r vault/hashicorp/requirements.txt

      - name: Validate bootstrap configuration
        id: config
        env:
          VAULT_ADDR: ${{ secrets.VAULT_ADDR }}
          VAULT_ROLE_ID: ${{ secrets.VAULT_ROLE_ID }}
          VAULT_SECRET_ID: ${{ secrets.VAULT_SECRET_ID }}
          VAULT_TOKEN: ${{ secrets.VAULT_TOKEN }}
          GHPAT: ${{ secrets.GHPAT }}
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
          REQUESTED_MODE: ${{ github.event.inputs.mode || 'sync' }}
          EVENT_NAME: ${{ github.event_name }}
        shell: bash
        run: |
          set -euo pipefail
          addr="${VAULT_ADDR:-}"
          addr_lc="$(printf '%s' "$addr" | tr '[:upper:]' '[:lower:]')"
          placeholder=false
          case "$addr_lc" in
            *your-vault-domain.com*|*vault.yourdomain.com*|*example.com*|*your-vault*)
              placeholder=true
              ;;
          esac

          vault_ready=false
          if [[ -n "$addr" && "$placeholder" == false ]] &&
             { [[ -n "${VAULT_TOKEN:-}" ]] ||
               { [[ -n "${VAULT_ROLE_ID:-}" ]] && [[ -n "${VAULT_SECRET_ID:-}" ]]; }; }; then
            vault_ready=true
          fi

          pat_ready=false
          if [[ -n "${GHPAT:-}" || -n "${PAT_TOKEN:-}" ]]; then
            pat_ready=true
          fi

          echo "vault_ready=$vault_ready" >> "$GITHUB_OUTPUT"
          echo "pat_ready=$pat_ready" >> "$GITHUB_OUTPUT"
          echo "mode=$REQUESTED_MODE" >> "$GITHUB_OUTPUT"
          echo "Vault configuration present: $vault_ready"
          echo "GitHub PAT present: $pat_ready"

          if [[ "$EVENT_NAME" == "schedule" && "$vault_ready" != "true" ]]; then
            echo "::error::Scheduled sync requires VAULT_ADDR and VAULT_TOKEN or both AppRole credentials. Configure them before relying on scheduled distribution."
            exit 1
          fi

      - name: Validate requested mode
        if: github.event_name == 'workflow_dispatch'
        env:
          MODE: ${{ steps.config.outputs.mode }}
        shell: bash
        run: |
          set -euo pipefail
          case "$MODE" in
            sync|dry_run|ingest|ensure|rotate|full|github_only) ;;
            *) echo "::error::Unsupported mode"; exit 2 ;;
          esac
          if [[ "$MODE" == "full" || "$MODE" == "rotate" ]]; then
            echo "::warning::Mode '$MODE' can rotate internal credentials. Downstream services may need coordinated updates. Prefer sync unless rotation is intentional."
          fi

      - name: Vault orchestrator
        if: steps.config.outputs.vault_ready == 'true' && steps.config.outputs.mode != 'github_only'
        env:
          VAULT_ADDR: ${{ secrets.VAULT_ADDR }}
          VAULT_TOKEN: ${{ secrets.VAULT_TOKEN }}
          VAULT_ROLE_ID: ${{ secrets.VAULT_ROLE_ID }}
          VAULT_SECRET_ID: ${{ secrets.VAULT_SECRET_ID }}
          # Ingest variables are only used by the explicitly selected ingest/full
          # modes. Existing Vault values are preserved by ingest_from_github.py.
          GHPAT: ${{ secrets.GHPAT }}
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          APOLLO_API_KEY: ${{ secrets.APOLLO_API_KEY }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          STRIPE_PUBLISHABLE_KEY: ${{ secrets.STRIPE_PUBLISHABLE_KEY }}
          STRIPE_PRICE_STARTER: ${{ secrets.STRIPE_PRICE_STARTER }}
          STRIPE_PRICE_PRO: ${{ secrets.STRIPE_PRICE_PRO }}
          STRIPE_PRICE_AGENCY: ${{ secrets.STRIPE_PRICE_AGENCY }}
          REVENUE_WEBHOOK_URL: ${{ secrets.REVENUE_WEBHOOK_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
          APP_URL: ${{ secrets.APP_URL }}
          APP_BASE_URL_PAYMENTS: ${{ secrets.APP_BASE_URL_PAYMENTS }}
          APP_BASE_URL_RHNS: ${{ secrets.APP_BASE_URL_RHNS }}
          APP_BASE_URL_ATLAS: ${{ secrets.APP_BASE_URL_ATLAS }}
          APP_BASE_URL_ZEUS: ${{ secrets.APP_BASE_URL_ZEUS }}
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
          GITHUB_READ_TOKEN: ${{ secrets.GITHUB_READ_TOKEN }}
          SLACK_USER_TOKEN: ${{ secrets.SLACK_USER_TOKEN }}
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          HUBSPOT_API_KEY: ${{ secrets.HUBSPOT_API_KEY }}
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          PIXEL10_SSH_KEY: ${{ secrets.PIXEL10_SSH_KEY }}
          PIXEL10_IP: ${{ secrets.PIXEL10_IP }}
          PIXEL10_SSH_PORT: ${{ secrets.PIXEL10_SSH_PORT }}
          GITHUB_ORG: Garrettc123
          ZERO_TOUCH_MODE: ${{ steps.config.outputs.mode }}
        working-directory: vault/hashicorp
        shell: bash
        run: |
          set -euo pipefail
          mode="${ZERO_TOUCH_MODE:-sync}"
          case "$mode" in
            sync) python zero_touch.py sync ;;
            dry_run) python zero_touch.py dry_run ;;
            ingest) python zero_touch.py ingest ;;
            ensure) python zero_touch.py ensure ;;
            rotate) python zero_touch.py rotate ;;
            full) python zero_touch.py full ;;
            github_only) echo "::error::github_only must use the dedicated fallback step"; exit 2 ;;
            *) echo "::error::Unsupported mode"; exit 2 ;;
          esac

      - name: Sync read-only provider credentials to Vercel Preview
        if: steps.config.outputs.vault_ready == 'true' && steps.config.outputs.mode == 'sync'
        env:
          VAULT_ADDR: ${{ secrets.VAULT_ADDR }}
          VAULT_TOKEN: ${{ secrets.VAULT_TOKEN }}
          VAULT_ROLE_ID: ${{ secrets.VAULT_ROLE_ID }}
          VAULT_SECRET_ID: ${{ secrets.VAULT_SECRET_ID }}
          GARCAR_VERCEL_DRY_RUN: "0"
        working-directory: vault/hashicorp
        shell: bash
        run: python sync_to_vercel_preview.py

      - name: GitHub-only fallback
        if: steps.config.outputs.vault_ready != 'true' || steps.config.outputs.mode == 'github_only'
        env:
          GHPAT: ${{ secrets.GHPAT }}
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
          GH_TOKEN: ${{ secrets.GHPAT || secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
          GITHUB_ORG: Garrettc123
        working-directory: vault/hashicorp
        run: python ensure_github_only.py

      - name: Job summary
        if: always()
        env:
          VAULT_READY: ${{ steps.config.outputs.vault_ready }}
          PAT_READY: ${{ steps.config.outputs.pat_ready }}
          MODE: ${{ steps.config.outputs.mode }}
          EVENT_NAME: ${{ github.event_name }}
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          {
            echo "## Garcar Vault Sync"
            echo ""
            echo "- Trigger: `$EVENT_NAME`"
            echo "- Requested mode: `${MODE:-unknown}`"
            echo "- Vault configuration present: `${VAULT_READY:-unknown}`"
            echo "- GitHub PAT present: `${PAT_READY:-unknown}`"
            echo "- Job result: `$JOB_STATUS`"
            echo ""
            echo "This summary reports configuration presence only; it does not display secret values."
          } >> "$GITHUB_STEP_SUMMARY"
