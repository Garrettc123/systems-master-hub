name: Garcar Vault GitHub Sync

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type SYNC to pull from Vault and propagate'
        required: true
        type: string

permissions:
  contents: read

jobs:
  vault-sync:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || inputs.confirm == 'SYNC'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check Vault credentials
        id: vault
        env:
          VAULT_ADDR: ${{ secrets.VAULT_ADDR }}
        run: |
          if [ -z "${VAULT_ADDR:-}" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "VAULT_ADDR not set — soft-skip vault sync"
            echo "Add VAULT_ADDR + (VAULT_TOKEN or VAULT_ROLE_ID/VAULT_SECRET_ID)"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: steps.vault.outputs.ready == 'true'
        run: |
          if [ -f vault/hashicorp/requirements.txt ]; then
            pip install -r vault/hashicorp/requirements.txt
          else
            pip install hvac requests
          fi

      - name: Sync Vault to GitHub
        if: steps.vault.outputs.ready == 'true'
        env:
          VAULT_ADDR: ${{ secrets.VAULT_ADDR }}
          VAULT_TOKEN: ${{ secrets.VAULT_TOKEN }}
          VAULT_ROLE_ID: ${{ secrets.VAULT_ROLE_ID }}
          VAULT_SECRET_ID: ${{ secrets.VAULT_SECRET_ID }}
          GHPAT: ${{ secrets.GHPAT }}
        run: |
          set -euo pipefail
          if [ ! -f vault/hashicorp/sync_to_github.py ]; then
            echo "sync_to_github.py missing; soft-skip"
            exit 0
          fi
          cd vault/hashicorp
          python sync_to_github.py

      - name: Summary
        run: |
          if [ "${{ steps.vault.outputs.ready }}" = "true" ]; then
            echo "Vault sync finished"
          else
            echo "Vault sync soft-skipped (credentials not provisioned)"
          fi
