name: Zero-Human Platform - Execute All 3 Paths

on:
  workflow_dispatch:
    inputs:
      paths:
        description: 'Which paths to execute'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - fast
          - complete
          - careful

jobs:
  zero-human-deploy:
    runs-on: ubuntu-latest
    name: Execute Zero-Human Platform

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PyYAML requests

      - name: System Information
        run: |
          echo "System Status"
          echo "================="
          uname -a
          python --version
          bash --version | head -1
          git --version
          echo ""
          echo "Repository Info"
          echo "=================="
          echo "Owner: Garrettc123"
          echo "Repo: systems-master-hub"
          echo "Branch: main"
          echo "Timestamp: $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
          echo ""

      - name: PATH 1 - FAST - Market Scanner (15 min)
        id: path1
        if: inputs.paths == 'all' || inputs.paths == 'fast'
        run: |
          echo ""
          echo "PATH 1: FAST (15 minutes) - Market Scanner + Monitoring"
          echo ""
          if [ -f "zero-human/market-scanner-safe.py" ]; then
            echo "Executing market-scanner-safe.py..."
            cd zero-human && python3 market-scanner-safe.py && cd ..
            echo "Market scanner completed successfully"
          else
            echo "market-scanner-safe.py not found - skipping"
          fi
          echo ""
          echo "Monitoring Dashboard..."
          if [ -f "zero-human/monitoring-dashboard.py" ]; then
            cd zero-human && python3 monitoring-dashboard.py && cd ..
            echo "Monitoring dashboard initialized"
          else
            echo "monitoring-dashboard.py not found - skipping"
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Path 1 Complete**: Market Scanner + Monitoring" >> $GITHUB_STEP_SUMMARY

      - name: PATH 2 - COMPLETE - GitHub Sync (45 min)
        id: path2
        if: inputs.paths == 'all' || inputs.paths == 'complete'
        run: |
          echo ""
          echo "PATH 2: COMPLETE (45 minutes) - GitHub Sync + Security"
          echo ""
          if [ -f "zero-human/github-sync-secure.sh" ]; then
            echo "Executing github-sync-secure.sh..."
            cd zero-human && bash github-sync-secure.sh && cd ..
            echo "GitHub sync completed successfully"
          else
            echo "github-sync-secure.sh not found - skipping"
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Path 2 Complete**: GitHub Sync + Security" >> $GITHUB_STEP_SUMMARY

      - name: PATH 3 - CAREFUL - Email Campaign (1 week)
        id: path3
        if: inputs.paths == 'all' || inputs.paths == 'careful'
        run: |
          echo ""
          echo "PATH 3: CAREFUL (1 week) - Email Campaign + Compliance"
          echo ""
          if [ -f "zero-human/email-campaign-compliant.sh" ]; then
            echo "Executing email-campaign-compliant.sh..."
            cd zero-human && bash email-campaign-compliant.sh && cd ..
            echo "Email campaign templates generated"
            echo "REQUIRES MANUAL REVIEW before Wave 2+ sending"
          else
            echo "email-campaign-compliant.sh not found - skipping"
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Path 3 Complete**: Email Campaign + Compliance" >> $GITHUB_STEP_SUMMARY

      - name: Generate Results Summary
        if: always()
        run: |
          echo ""
          echo "========================================================="
          echo "ALL PATHS EXECUTION COMPLETE"
          echo "========================================================="
          echo ""
          echo "Generated Files:"
          ls -lah zero-human/market_analysis_*.json 2>/dev/null || echo "  (no market analysis files)"
          ls -lah zero-human/email_*.txt 2>/dev/null || echo "  (no email templates)"
          ls -lah zero-human/monitor_*.log 2>/dev/null || echo "  (no monitoring logs)"
          echo ""
          echo "Path 1 (Fast): ${{ steps.path1.outcome }}"
          echo "Path 2 (Complete): ${{ steps.path2.outcome }}"
          echo "Path 3 (Careful): ${{ steps.path3.outcome }}"
          echo ""
          echo "Next Steps:"
          echo "  1. Review market analysis results"
          echo "  2. Verify GitHub repos synced"
          echo "  3. Review email templates (requires legal approval)"
          echo "  4. Send Wave 1 emails (after verification)"
          echo "========================================================="

      - name: Upload Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zero-human-execution-results
          path: |
            zero-human/market_analysis_*.json
            zero-human/email_*.txt
            zero-human/monitor_*.log
          retention-days: 90
        continue-on-error: true
