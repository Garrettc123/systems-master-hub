name: Daily repository readiness audit

on:
  schedule:
    - cron: '15 12 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  audit:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GARCAR_AUDIT_TOKEN || github.token }}
      GITHUB_OWNER: Garrettc123
      AUDIT_REPOSITORY: Garrettc123/systems-master-hub
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate readiness report
        run: python scripts/daily_repository_readiness.py > readiness-report.md
      - name: Create or update canonical audit issue
        run: |
          body="$(cat readiness-report.md)"
          existing=$(gh issue list --repo "$AUDIT_REPOSITORY" --state open --label repository-audit --search 'Daily repository readiness audit in:title' --json number --jq '.[0].number')
          if [ -n "$existing" ] && [ "$existing" != "null" ]; then
            gh issue edit "$existing" --repo "$AUDIT_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$AUDIT_REPOSITORY" --title 'Daily repository readiness audit' --label automation --label repository-audit --body "$body"
          fi
