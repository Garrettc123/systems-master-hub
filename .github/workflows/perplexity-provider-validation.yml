name: Perplexity Provider Validation

on:
  pull_request:
    branches: [main]
    paths:
      - 'orchestrator/providers/base.py'
      - 'orchestrator/providers/perplexity_client.py'
      - 'tests/test_perplexity_client.py'
      - '.github/workflows/perplexity-provider-validation.yml'
  push:
    branches: [main]
    paths:
      - 'orchestrator/providers/base.py'
      - 'orchestrator/providers/perplexity_client.py'
      - 'tests/test_perplexity_client.py'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile provider
        run: python -m py_compile orchestrator/providers/base.py orchestrator/providers/perplexity_client.py
      - name: Run offline contract tests
        run: python -m unittest discover -s tests -p 'test_perplexity_client.py' -v
