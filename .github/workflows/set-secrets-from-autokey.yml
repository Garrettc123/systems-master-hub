name: AutoKey — Distribute Secrets to All Repos

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "true = print only, false = actually write secrets"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

jobs:
  distribute-secrets:
    runs-on: ubuntu-latest

    env:
      GH_TOKEN: ${{ secrets.GH_PAT }}
      OWNER: Garrettc123

    steps:
      - name: Confirm run mode
        run: |
          echo "Dry run: ${{ github.event.inputs.dry_run }}"
          echo "Owner:   $OWNER"

      - name: Distribute secrets to all target repos
        run: |
          set -e

          REPOS=(
            systems-stripe-webhook
            systems-leadgen-engine
            systems-linear-sync
            systems-revenue-ops
            systems-customers-core
          )

          declare -A SECRETS=(
            [GH_PAT]="${{ secrets.GH_PAT }}"
            [NOTION_TOKEN]="${{ secrets.NOTION_TOKEN }}"
            [NOTION_EVENT_LOG_DB]="${{ secrets.NOTION_EVENT_LOG_DB }}"
            [NOTION_REVENUE_DB]="${{ secrets.NOTION_REVENUE_DB }}"
            [NOTION_CUSTOMERS_DB]="${{ secrets.NOTION_CUSTOMERS_DB }}"
            [NOTION_CHURN_DB]="${{ secrets.NOTION_CHURN_DB }}"
            [NOTION_LEADS_DB]="${{ secrets.NOTION_LEADS_DB }}"
            [NOTION_LINEAR_SYNC_DB]="${{ secrets.NOTION_LINEAR_SYNC_DB }}"
            [LINEAR_API_KEY]="${{ secrets.LINEAR_API_KEY }}"
            [LINEAR_TEAM_ID]="${{ secrets.LINEAR_TEAM_ID }}"
            [LINEAR_ONBOARDING_LABEL]="${{ secrets.LINEAR_ONBOARDING_LABEL }}"
            [SLACK_WEBHOOK_URL]="${{ secrets.SLACK_WEBHOOK_URL }}"
            [OPENAI_API_KEY]="${{ secrets.OPENAI_API_KEY }}"
            [SENDGRID_API_KEY]="${{ secrets.SENDGRID_API_KEY }}"
            [STRIPE_WEBHOOK_SECRET]="${{ secrets.STRIPE_WEBHOOK_SECRET }}"
          )

          DRY_RUN="${{ github.event.inputs.dry_run }}"

          for repo in "${REPOS[@]}"; do
            echo "==============================="
            echo "Repo: $OWNER/$repo"
            echo "==============================="

            for secret_name in "${!SECRETS[@]}"; do
              secret_val="${SECRETS[$secret_name]}"

              if [ -z "$secret_val" ]; then
                echo "  SKIP  $secret_name (empty in master hub)"
                continue
              fi

              if [ "$DRY_RUN" = "true" ]; then
                echo "  DRY   $secret_name -> (value present, not writing)"
              else
                echo -n "$secret_val" | gh secret set "$secret_name" \
                  --repo "$OWNER/$repo" \
                  --app actions
                echo "  OK    $secret_name"
              fi
            done

            echo
          done

          echo "Done. Dry run: $DRY_RUN"
