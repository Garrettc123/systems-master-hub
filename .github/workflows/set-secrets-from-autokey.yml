name: AutoKey Quantum Secret Distributor
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry Run? (true/false)'
        required: true
        default: 'true'

jobs:
  distribute-secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Distribute Secrets via GH CLI
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          LINEAR_TOKEN: ${{ secrets.LINEAR_TOKEN }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          REPOS=(
            "Garrettc123/systems-stripe-webhook"
            "Garrettc123/systems-leadgen-engine"
            "Garrettc123/systems-linear-sync"
            "Garrettc123/systems-revenue-ops"
            "Garrettc123/systems-customers-core"
          )

          SECRETS_LIST=(
            "STRIPE_SECRET_KEY"
            "OPENAI_API_KEY"
            "LINEAR_TOKEN"
            "DATABASE_URL"
            "PAT_TOKEN"
          )

          for REPO in "${REPOS[@]}"; do
            echo "Processing $REPO..."
            for SECRET_NAME in "${SECRETS_LIST[@]}"; do
              SECRET_VALUE="${!SECRET_NAME}"

              if [ "${{ github.event.inputs.dry_run }}" == "false" ]; then
                echo "Setting $SECRET_NAME in $REPO..."
                echo "$SECRET_VALUE" | gh secret set "$SECRET_NAME" --repo "$REPO"
              else
                echo "[DRY RUN] Would set $SECRET_NAME in $REPO"
              fi
            done
          done
