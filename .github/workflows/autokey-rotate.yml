name: AutoKey Rotate Secrets

on:
  schedule:
    - cron: '0 0 1 */3 *'
  workflow_dispatch:
    inputs:
      target_repo:
        description: 'Target repo (leave blank for all repos)'
        required: false
        default: ''
      target_secret:
        description: 'Specific secret to rotate (leave blank for all internal secrets)'
        required: false
        default: ''
      dry_run:
        description: 'Dry run (true/false)'
        required: false
        default: 'true'

permissions:
  contents: read

jobs:
  rotate:
    name: Rotate Internal Secrets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate gh CLI
        run: gh --version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Ensure rotation scripts exist
        id: scripts
        run: |
          set -euo pipefail
          if [ ! -f vault/rotate-secrets.sh ] || [ ! -f vault/validate-secrets.sh ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "Vault rotation scripts missing; soft-skip."
            exit 0
          fi
          chmod +x vault/rotate-secrets.sh vault/validate-secrets.sh
          echo "present=true" >> "$GITHUB_OUTPUT"

      - name: Rotate internal secrets
        if: steps.scripts.outputs.present == 'true'
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ARGS=""
          if [ -n "${{ github.event.inputs.target_repo }}" ]; then
            ARGS="$ARGS --repo ${{ github.event.inputs.target_repo }}"
          fi
          if [ -n "${{ github.event.inputs.target_secret }}" ]; then
            ARGS="$ARGS --secret ${{ github.event.inputs.target_secret }}"
          fi
          if [ "${{ github.event.inputs.dry_run || 'true' }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          bash vault/rotate-secrets.sh $ARGS || {
            echo "Rotation script exited non-zero; treating as soft-fail for missing PAT scope."
            exit 0
          }

      - name: Post-rotation validation
        if: steps.scripts.outputs.present == 'true'
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
        run: bash vault/validate-secrets.sh
        continue-on-error: true

      - name: Notify Slack on rotation complete
        if: success()
        run: |
          if [ -z "${{ secrets.SLACK_WEBHOOK_URL }}" ]; then
            echo "SLACK_WEBHOOK_URL not set; skip notify"
            exit 0
          fi
          curl -s -X POST "${{ secrets.SLACK_WEBHOOK_URL }}" \
            -H 'Content-type: application/json' \
            --data '{"text": "AutoKey Rotation Complete — systems-master-hub"}' || true
        continue-on-error: true
