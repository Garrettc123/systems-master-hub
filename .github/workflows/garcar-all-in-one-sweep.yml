          script: |
            try {
              await github.rest.repos.createDispatchEvent({
                owner: 'Garrettc123',
                repo: 'enterprise-mlops-platform',
                event_type: 'garcar-sweep',
                client_payload: { mode: '${{ github.event.inputs.mode || "full" }}', triggered_by: 'systems-master-hub', timestamp: new Date().toISOString() }
