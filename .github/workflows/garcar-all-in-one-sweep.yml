name: GARCAR All-In-One Sweep

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Sweep mode: full | payments | health | deploy'
        required: false
        default: 'full'
  push:
    branches: [main]
    paths:
      - 'SWEEP-MANIFEST.md'
      - 'orchestrate/**'
  schedule:
    - cron: '0 */6 * * *'

permissions:
  contents: read
  issues: write
  actions: read

jobs:
  dispatch-garcar-payments:
    name: Trigger garcar-payments
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch deploy to garcar-payments
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
          script: |
            try {
              await github.rest.repos.createDispatchEvent({
                owner: 'Garrettc123',
                repo: 'garcar-payments',
                event_type: 'garcar-sweep',
                client_payload: { mode: '${{ github.event.inputs.mode || "full" }}', triggered_by: 'systems-master-hub', timestamp: new Date().toISOString() }
              });
              console.log('garcar-payments dispatched');
            } catch(e) {
              console.log('garcar-payments dispatch:', e.message);
            }

  dispatch-garcar-payment-loop:
    name: Trigger garcar-payment-loop
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch to garcar-payment-loop
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
          script: |
            try {
