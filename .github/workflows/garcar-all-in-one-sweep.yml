            }

  dispatch-titan:
    name: 🏆 Trigger TITAN
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch deploy to TITAN
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            try {
              await github.rest.repos.createDispatchEvent({
                owner: 'Garrettc123',
                repo: 'TITAN-Autonomous-Business-Empire',
                event_type: 'garcar-sweep',
                client_payload: { mode: '${{ github.event.inputs.mode || "full" }}', triggered_by: 'systems-master-hub', timestamp: new Date().toISOString() }
              });
              console.log('✅ TITAN dispatched');
            } catch(e) {
              console.log('⚠️ TITAN dispatch:', e.message);
            }

  dispatch-mlops:
    name: 🧠 Trigger enterprise-mlops-platform
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch deploy to enterprise-mlops-platform
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            try {
              await github.rest.repos.createDispatchEvent({
                owner: 'Garrettc123',
                repo: 'enterprise-mlops-platform',
                event_type: 'garcar-sweep',
                client_payload: { mode: '${{ github.event.inputs.mode || "full" }}', triggered_by: 'systems-master-hub', timestamp: new Date().toISOString() }
              });
              console.log('✅ enterprise-mlops-platform dispatched');
            } catch(e) {
              console.log('⚠️ enterprise-mlops-platform dispatch:', e.message);
            }

  dispatch-atlas:
    name: 📊 Trigger atlas-dashboard
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch to atlas-dashboard
        uses: actions/github-script@v7
        with:
