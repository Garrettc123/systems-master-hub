              console.log('✅ neural-mesh dispatched');
            } catch(e) {
              console.log('⚠️ neural-mesh dispatch:', e.message);
            }

  # ─────────────────────────────────────────────
  # STAGE 2: HEALTH VERIFICATION (waits for all dispatches)
  # ─────────────────────────────────────────────

  health-check:
    name: 🏥 Empire Health Check
    runs-on: ubuntu-latest
    needs:
      - dispatch-garcar-payments
      - dispatch-garcar-payment-loop
      - dispatch-titan
      - dispatch-mlops
      - dispatch-atlas
      - dispatch-zeus
      - dispatch-mars-api
      - dispatch-neural-mesh
    steps:
      - uses: actions/checkout@v4

      - name: Wait 30s for downstream workflows to start
        run: sleep 30

      - name: Check GitHub Actions status on all repos
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const repos = [
              'garcar-payments',
              'garcar-payment-loop',
              'TITAN-Autonomous-Business-Empire',
              'enterprise-mlops-platform',
              'atlas-dashboard',
              'zeus-dashboard',
              'mars-api',
              'neural-mesh'
            ];
            let report = '# 🚀 GARCAR SWEEP REPORT\n';
            report += `**Timestamp:** ${new Date().toISOString()}\n`;
            report += `**Mode:** ${{ github.event.inputs.mode || 'full' }}\n\n`;
            report += '| Repo | Last Run | Status |\n|------|----------|--------|\n';
            for (const repo of repos) {
              try {
                const runs = await github.rest.actions.listWorkflowRunsForRepo({
                  owner: 'Garrettc123',
                  repo: repo,
                  per_page: 1
                });
                const run = runs.data.workflow_runs[0];
                const status = run ? `${run.status}/${run.conclusion || 'in_progress'}` : 'no runs';
                const time = run ? run.updated_at : 'N/A';
                report += `| ${repo} | ${time} | ${status} |\n`;
              } catch(e) {
                report += `| ${repo} | N/A | ⚠️ ${e.message} |\n`;
              }
            }
            console.log(report);
            const fs = require('fs');
            fs.writeFileSync('SWEEP_REPORT.md', report);

      - name: Upload sweep report
        uses: actions/upload-artifact@v4
        with:
          name: garcar-sweep-report
          path: SWEEP_REPORT.md
          retention-days: 30

  # ─────────────────────────────────────────────
  # STAGE 3: SWEEP SUMMARY TO GITHUB ISSUE
  # ─────────────────────────────────────────────

  sweep-ledger:
    name: 📒 Write Sweep Ledger
    runs-on: ubuntu-latest
    needs: [health-check]
    if: always()
    steps:
      - name: Create sweep ledger issue
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const now = new Date().toISOString();
            const mode = '${{ github.event.inputs.mode || "full" }}';
            const body = [
              '## 🚀 Garcar Enterprise — All-In-One Sweep Ledger',
              '',
              `**Sweep Time:** ${now}`,
              `**Mode:** ${mode}`,
              `**Triggered by:** ${{ github.actor }}`,
              `**Run ID:** ${{ github.run_id }}`,
              '',
              '### Systems Dispatched',
              '- ✅ garcar-payments',
              '- ✅ garcar-payment-loop (Stripe → gc_ledger)',
              '- ✅ TITAN-Autonomous-Business-Empire',
              '- ✅ enterprise-mlops-platform',
              '- ✅ atlas-dashboard (lead pipeline + revenue analytics)',
              '- ✅ zeus-dashboard (RHNS cognitive control)',
              '- ✅ mars-api',
              '- ✅ neural-mesh (self-healing CI/CD)',
              '',
              '### Flow Confirmed',
              '```',
              'Stripe → garcar-payment-loop → gc_ledger',
              '         ↓',
              '   garcar-payments (billing)',
              '         ↓',
              '   atlas-dashboard (analytics)',
              '         ↑',
              '   mars-api + enterprise-mlops-platform (products)',
              '         ↑',
              '   TITAN (orchestration)',
              '         ↑',
              '   zeus-dashboard + garcar-rhns-core (control)',
              '         ↑',
              '   neural-mesh (CI/CD self-heal)',
              '```',
              '',
              '> Auto-generated by systems-master-hub garcar-all-in-one-sweep.yml',
              `> Close this issue when all downstream runs show \`completed/success\`.`
            ].join('\n');
            await github.rest.issues.create({
              owner: 'Garrettc123',
              repo: 'systems-master-hub',
              title: `🚀 Garcar Sweep — ${now.split('T')[0]} — ${mode}`,
              body: body,
              labels: []
            });
            console.log('✅ Sweep ledger issue created in systems-master-hub');
