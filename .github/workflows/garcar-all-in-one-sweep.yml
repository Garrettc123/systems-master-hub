  dispatch-mars-api:
    name: 🚀 Trigger mars-api
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch to mars-api
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            try {
              await github.rest.repos.createDispatchEvent({
                owner: 'Garrettc123',
