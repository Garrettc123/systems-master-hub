                client_payload: { mode: '${{ github.event.inputs.mode || "full" }}', triggered_by: 'systems-master-hub', timestamp: new Date().toISOString() }
              });
              console.log('zeus-dashboard dispatched');
            } catch(e) {
              console.log('zeus-dashboard dispatch:', e.message);
            }

  health-check:
    name: Empire Health Check
    runs-on: ubuntu-latest
    needs:
      - dispatch-garcar-payments
      - dispatch-garcar-payment-loop
      - dispatch-titan
      - dispatch-mlops
      - dispatch-atlas
      - dispatch-zeus
    steps:
      - uses: actions/checkout@v4

      - name: Wait for downstream workflows
        run: sleep 15

      - name: Check GitHub Actions status on core repos
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const repos = [
              'garcar-payments',
              'TITAN-Autonomous-Business-Empire',
              'enterprise-mlops-platform',
              'atlas-dashboard',
              'zeus-dashboard'
            ];
            let report = '# GARCAR SWEEP REPORT\n';
            report += `**Timestamp:** ${new Date().toISOString()}\n`;
            report += `**Mode:** ${{ github.event.inputs.mode || 'full' }}\n\n`;
            report += '| Repo | Last Run | Status |\n|------|----------|--------|\n';
            for (const repo of repos) {
              try {
                const runs = await github.rest.actions.listWorkflowRunsForRepo({
                  owner: 'Garrettc123',
                  repo: repo,
                  per_page: 1
                });
                const run = runs.data.workflow_runs[0];
                const status = run ? `${run.status}/${run.conclusion || 'in_progress'}` : 'no runs';
                const time = run ? run.updated_at : 'N/A';
                report += `| ${repo} | ${time} | ${status} |\n`;
              } catch(e) {
                report += `| ${repo} | N/A | ${e.message} |\n`;
              }
            }
            console.log(report);
            const fs = require('fs');
            fs.writeFileSync('SWEEP_REPORT.md', report);

      - name: Upload sweep report
        uses: actions/upload-artifact@v4
        with:
          name: garcar-sweep-report
          path: SWEEP_REPORT.md
          retention-days: 30

  sweep-ledger:
    name: Write Sweep Ledger
    runs-on: ubuntu-latest
    needs: [health-check]
    if: always()
    steps:
      - name: Create sweep ledger issue
        uses: actions/github-script@v7
        continue-on-error: true
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const now = new Date().toISOString();
            const mode = '${{ github.event.inputs.mode || "full" }}';
            const body = [
              '## Garcar Enterprise — All-In-One Sweep Ledger',
              '',
              `**Sweep Time:** ${now}`,
              `**Mode:** ${mode}`,
              `**Triggered by:** ${{ github.actor }}`,
              `**Run ID:** ${{ github.run_id }}`,
              '',
              '### Systems Dispatched',
              '- garcar-payments',
              '- garcar-payment-loop',
              '- TITAN-Autonomous-Business-Empire',
              '- enterprise-mlops-platform',
              '- atlas-dashboard',
              '- zeus-dashboard',
              '',
              '> Auto-generated by systems-master-hub'
            ].join('\n');
            try {
              await github.rest.issues.create({
                owner: 'Garrettc123',
                repo: 'systems-master-hub',
                title: `Garcar Sweep — ${now.split('T')[0]} — ${mode}`,
                body: body
              });
              console.log('Sweep ledger issue created');
            } catch (e) {
              console.log('Issue create skipped:', e.message);
            }
