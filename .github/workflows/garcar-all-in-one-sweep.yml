  dispatch-neural-mesh:
    name: 🔗 Trigger neural-mesh
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch to neural-mesh
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            try {
              await github.rest.repos.createDispatchEvent({
                owner: 'Garrettc123',
                repo: 'neural-mesh',
                event_type: 'garcar-sweep',
                client_payload: { mode: '${{ github.event.inputs.mode || "full" }}', triggered_by: 'systems-master-hub', timestamp: new Date().toISOString() }
