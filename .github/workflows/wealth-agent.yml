name: Wealth Agent Loop

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run-agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install stripe requests httpx
          fi

      - name: Check secrets
        id: secrets
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          APOLLO_API_KEY: ${{ secrets.APOLLO_API_KEY }}
        run: |
          READY=true
          if [ -z "${STRIPE_SECRET_KEY:-}" ]; then
            echo "STRIPE_SECRET_KEY missing"
            READY=false
          fi
          if [ -z "${APOLLO_API_KEY:-}" ]; then
            echo "APOLLO_API_KEY missing"
            READY=false
          fi
          if [ "$READY" = true ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "All required secrets present — running wealth loop"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Wealth agent soft-skip (required secrets not provisioned)"
          fi

      - name: Run Wealth Loop Agent
        if: steps.secrets.outputs.ready == 'true'
        run: |
          if [ -f agents/wealth_loop.py ]; then
            python agents/wealth_loop.py
          else
            echo "agents/wealth_loop.py not found"
            exit 1
          fi
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          APOLLO_API_KEY: ${{ secrets.APOLLO_API_KEY }}
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}

      - name: Soft-skip notice
        if: steps.secrets.outputs.ready != 'true'
        run: |
          echo "Wealth agent completed in soft-skip mode."
          echo "Provision STRIPE_SECRET_KEY + APOLLO_API_KEY (and optionally SUPABASE_*) to enable live Apollo → Stripe checkout generation."

      - name: Post status
        if: always()
        run: echo "Wealth agent run complete at $(date -u +%Y-%m-%dT%H:%M:%SZ)"
