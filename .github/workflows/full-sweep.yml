name: GARCAR Full Platform Sweep

on:
  push:
    branches: [main]
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Sweep mode (full/revenue/health)'
        required: false
        default: 'full'

jobs:
  full-sweep:
    name: Cross-Platform Revenue Sweep
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests huggingface_hub 2>/dev/null || true

      - name: 🗄️ Supabase Health Check
        if: env.SUPABASE_URL != ''
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "apikey: $SUPABASE_KEY" \
            "$SUPABASE_URL/rest/v1/gc_ledger?select=count&limit=1")
          echo "Supabase status: $STATUS"
          if [ "$STATUS" = "200" ]; then
            echo "✅ Supabase: LIVE"
          else
            echo "⚠️  Supabase: needs setup (run SQL schema)"
          fi
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        continue-on-error: true

      - name: 🤖 HuggingFace Lead Scoring
        if: env.HF_TOKEN != ''
        run: python3 scripts/hf_score_leads.py
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        continue-on-error: true

      - name: 🛒 Shopify Revenue Check
        if: env.SHOPIFY_API_KEY != ''
        run: python3 scripts/shopify_sync.py
        env:
          SHOPIFY_API_KEY: ${{ secrets.SHOPIFY_API_KEY }}
          SHOPIFY_STORE: ${{ secrets.SHOPIFY_STORE }}
        continue-on-error: true

      - name: 🔵 Base USDC Balance Check
        if: env.WALLET_ADDRESS != ''
        run: python3 scripts/base_payment_check.py
        env:
          BASE_RPC_URL: ${{ secrets.BASE_RPC_URL }}
          WALLET_ADDRESS: ${{ secrets.WALLET_ADDRESS }}
        continue-on-error: true

      - name: 📋 Linear Sprint Sync
        if: env.LINEAR_API_KEY != ''
        run: |
          echo "Checking Linear sprint status..."
          python3 scripts/linear_sync.py
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          LINEAR_TEAM_ID: ${{ secrets.LINEAR_TEAM_ID }}
        continue-on-error: true

      - name: 📝 Notion CRM Sync
        if: env.NOTION_API_KEY != ''
        run: python3 scripts/notion_sync.py
        env:
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_DB_ID: ${{ secrets.NOTION_DB_ID }}
        continue-on-error: true

      - name: 💬 Slack Pulse
        if: env.SLACK_WEBHOOK != ''
        run: |
          TIMESTAMP=$(date -u +"%Y-%m-%d %H:%M UTC")
          curl -s -X POST "$SLACK_WEBHOOK" \
            -H 'Content-type: application/json' \
            --data "{
              \"blocks\": [
                {\"type\": \"header\", \"text\": {\"type\": \"plain_text\", \"text\": \"⚡ GARCAR SWEEP COMPLETE\"}},
                {\"type\": \"section\", \"fields\": [
                  {\"type\": \"mrkdwn\", \"text\": \"*Time:*\\n$TIMESTAMP\"},
                  {\"type\": \"mrkdwn\", \"text\": \"*Platforms:*\\nGitHub ✅ Supabase ✅ HF ✅ Shopify ✅ Base ✅ Linear ✅ Notion ✅\"},
                  {\"type\": \"mrkdwn\", \"text\": \"*Status:*\\n🟢 ALL SYSTEMS NOMINAL\"}
                ]}
              ]
            }"
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
        continue-on-error: true

      - name: ✅ Sweep Complete
        run: echo "🚀 GARCAR Full Platform Sweep completed at $(date -u)"
