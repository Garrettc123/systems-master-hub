name: Garcar AutoKey — Policy Reconciliation

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Reconciliation mode
        required: true
        default: dry-run
        type: choice
        options: [dry-run, apply, reconcile]
      confirm:
        description: Type APPLY-POLICY for apply/reconcile
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: garcar-autokey-policy-reconciliation
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      allowed: ${{ steps.gate.outputs.allowed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate policy and deny-by-default behavior
        run: |
          python -m json.tool control-plane/policy.json >/dev/null
          test "$(python control-plane/resolve_policy.py unknown-new-repository --field classification)" = "unclassified"
          test -z "$(python control-plane/resolve_policy.py unknown-new-repository --field secrets)"
      - id: gate
        env:
          MODE: ${{ inputs.mode }}
          CONFIRM: ${{ inputs.confirm }}
        run: |
          if [ "$MODE" = "dry-run" ] || [ "$CONFIRM" = "APPLY-POLICY" ]; then
            echo "allowed=true" >> "$GITHUB_OUTPUT"
          else
            echo "Apply/reconcile requires APPLY-POLICY" >&2
            exit 1
          fi

  reconcile:
    needs: validate
    if: needs.validate.outputs.allowed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reconcile approved secret names
        env:
          GH_TOKEN: ${{ secrets.GHPAT }}
          VAULT_ADDR: ${{ secrets.VAULT_ADDR }}
          VAULT_ROLE_ID: ${{ secrets.VAULT_ROLE_ID }}
          VAULT_SECRET_ID: ${{ secrets.VAULT_SECRET_ID }}
        run: python control-plane/autokey_reconcile.py --mode "${{ inputs.mode }}"
      - name: Summary
        if: always()
        run: |
          echo '### AutoKey policy reconciliation' >> "$GITHUB_STEP_SUMMARY"
          echo '- Mode: `${{ inputs.mode }}`' >> "$GITHUB_STEP_SUMMARY"
          echo '- Secret values were not printed or persisted.' >> "$GITHUB_STEP_SUMMARY"
          echo '- Unclassified repositories received no secrets.' >> "$GITHUB_STEP_SUMMARY"
