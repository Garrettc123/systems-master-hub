# ===========================================================================
# GARCAR AUTOKEY — Secret Presence Validation Workflow
# Validates all required secrets exist across all repos listed in registry/repos.json.
# Runs daily and after any push to vault/ or .github/workflows/.
# ===========================================================================
name: "🔐 AutoKey — Validate Secrets"

on:
  push:
    paths:
      - 'vault/**'
      - '.github/workflows/autokey-*.yml'
      - 'registry/repos.json'
      - 'contracts/**'

  schedule:
    # Daily check at 6am UTC
    - cron: '0 6 * * *'

  workflow_dispatch:
    inputs:
      target_repo:
        description: 'Target repo to validate (blank = all)'
        required: false
        default: ''

jobs:
  validate:
    name: Validate Secret Presence
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Make script executable
        run: chmod +x vault/validate-secrets.sh

      - name: Validate all required secrets
        env:
          GH_TOKEN: ${{ secrets.GHPAT || secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.target_repo }}" ]; then
            ARGS="--repo ${{ github.event.inputs.target_repo }}"
          fi
          bash vault/validate-secrets.sh $ARGS

      - name: Post validation matrix to summary
        env:
          GH_TOKEN: ${{ secrets.GHPAT || secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          echo "## 🔐 AutoKey Secret Validation" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Time:** $(date -u)" >> $GITHUB_STEP_SUMMARY
          echo "**Org:** Garrettc123" >> $GITHUB_STEP_SUMMARY
          echo "**Target Repo:** ${{ github.event.inputs.target_repo || 'all' }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Registry Coverage" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          total_repos=$(jq '[.tier1.repos, .tier2.repos, .tier3.repos] | map(keys | length) | add' registry/repos.json)
          echo "- Repos in registry: ${total_repos}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Repo | Tier | Required Secrets |" >> $GITHUB_STEP_SUMMARY
          echo "|------|------|-----------------|" >> $GITHUB_STEP_SUMMARY
          jq -r '
            [
              ("tier1|" + ((.tier1.repos // {}) | to_entries[] | .key + "|" + ((.value.requiredSecrets // []) | join(", ")))),
              ("tier2|" + ((.tier2.repos // {}) | to_entries[] | .key + "|" + ((.value.requiredSecrets // []) | join(", ")))),
              ("tier3|" + ((.tier3.repos // {}) | to_entries[] | .key + "|" + ((.value.requiredSecrets // []) | join(", "))))
            ]
            | flatten[]
          ' registry/repos.json | while IFS='|' read -r tier repo secrets; do
            echo "| ${repo} | ${tier^^} | ${secrets:-—} |" >> $GITHUB_STEP_SUMMARY
          done

      - name: Notify Slack on failure
        if: failure()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [ -z "${SLACK_WEBHOOK_URL}" ]; then
            echo "SLACK_WEBHOOK_URL not set; skip notify"
            exit 0
          fi
          ACTIONS_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions"
          curl -s -X POST "${SLACK_WEBHOOK_URL}" \
            -H 'Content-type: application/json' \
            --data '{
              "text": "🚨 *AutoKey Validation FAILED*\n• One or more required secrets are MISSING\n• Time: '"$(date -u)"'\n• Action needed: Run bash vault/vault-setup.sh\n• Run: <'"${ACTIONS_URL}"'|View Logs>"
            }'
        continue-on-error: true
