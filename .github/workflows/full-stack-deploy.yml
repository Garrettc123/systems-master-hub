name: GARCAR Full Stack Production Promotion

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Deployment environment
        required: true
        default: staging
        type: choice
        options: [dev, staging, prod]
      confirm:
        description: Type DEPLOY-GARCAR to authorize promotion
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: garcar-full-stack-${{ inputs.environment }}
  cancel-in-progress: false

env:
  TF_VERSION: '1.9.5'
  NODE_VERSION: '20'
  PYTHON_VERSION: '3.11'

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.gate.outputs.environment }}
    steps:
      - uses: actions/checkout@v4
      - id: gate
        run: |
          set -euo pipefail
          [[ "${{ inputs.confirm }}" == "DEPLOY-GARCAR" ]]
          echo "environment=${{ inputs.environment }}" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - name: Validate infrastructure configuration
        run: |
          set -euo pipefail
          test -d terraform
          terraform fmt -check -recursive terraform/

  terraform-plan:
    needs: preflight
    runs-on: ubuntu-latest
    environment: ${{ needs.preflight.outputs.environment }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - name: Configure AWS using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}
      - name: Verify AWS identity
        run: aws sts get-caller-identity
      - name: Verify required secrets are configured
        env:
          REQUIRED_SECRET_IDS: ${{ secrets.GARCAR_REQUIRED_SECRET_IDS }}
        run: |
          set -euo pipefail
          [[ -n "$REQUIRED_SECRET_IDS" ]] || { echo "GARCAR_REQUIRED_SECRET_IDS is not configured."; exit 1; }
          while IFS= read -r secret_id; do
            [[ -z "$secret_id" ]] && continue
            aws secretsmanager describe-secret --secret-id "$secret_id" --query '{ARN:ARN,RotationEnabled:RotationEnabled}' --output json >/dev/null
          done <<< "$REQUIRED_SECRET_IDS"
      - name: Terraform init
        working-directory: terraform
        run: terraform init -input=false
      - name: Terraform validate
        working-directory: terraform
        run: terraform validate
      - name: Terraform plan
        working-directory: terraform
        run: terraform plan -input=false -var="environment=${{ needs.preflight.outputs.environment }}" -out=tfplan
      - uses: actions/upload-artifact@v4
        with:
          name: terraform-plan-${{ needs.preflight.outputs.environment }}
          path: terraform/tfplan
          retention-days: 7

  terraform-apply:
    needs: [preflight, terraform-plan]
    runs-on: ubuntu-latest
    environment:
      name: ${{ needs.preflight.outputs.environment }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}
      - name: Terraform init
        working-directory: terraform
        run: terraform init -input=false
      - name: Download reviewed plan
        uses: actions/download-artifact@v4
        with:
          name: terraform-plan-${{ needs.preflight.outputs.environment }}
          path: terraform
      - name: Apply reviewed plan
        working-directory: terraform
        run: terraform apply -input=false tfplan
      - name: Capture outputs
        working-directory: terraform
        run: terraform output -json > outputs.json
      - uses: actions/upload-artifact@v4
        with:
          name: terraform-outputs-${{ needs.preflight.outputs.environment }}
          path: terraform/outputs.json
          retention-days: 7

  verification:
    needs: [preflight, terraform-apply]
    runs-on: ubuntu-latest
    environment: ${{ needs.preflight.outputs.environment }}
    steps:
      - uses: actions/checkout@v4
      - name: Require explicit live health-check contract
        env:
          HEALTHCHECK_URLS: ${{ secrets.GARCAR_HEALTHCHECK_URLS }}
        run: |
          set -euo pipefail
          [[ -n "$HEALTHCHECK_URLS" ]] || { echo "GARCAR_HEALTHCHECK_URLS is not configured."; exit 1; }
          failed=0
          while IFS= read -r url; do
            [[ -z "$url" ]] && continue
            echo "Checking $url"
            if ! curl --fail --silent --show-error --location --max-time 20 "$url" >/dev/null; then
              echo "FAILED: $url"
              failed=1
            fi
          done <<< "$HEALTHCHECK_URLS"
          [[ "$failed" -eq 0 ]]
      - name: Deployment success marker
        run: echo "GARCAR ${{ needs.preflight.outputs.environment }} infrastructure and live health verification passed."

  failure:
    if: ${{ failure() }}
    needs: [preflight, terraform-plan, terraform-apply, verification]
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "GARCAR promotion failed. No destructive rollback is executed automatically."
          echo "Use the documented last-known-good deployment procedure after incident review."
          exit 1
