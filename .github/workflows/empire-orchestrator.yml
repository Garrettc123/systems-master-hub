name: Master Empire Orchestrator (Zero-Human)
on:
  schedule:
    - cron: '0 13,17,21 * * *'
  workflow_dispatch:

permissions:
  id-token: write
  contents: write
  actions: write

jobs:
  verify_infrastructure:
    runs-on: ubuntu-latest
    steps:
      - run: |
          # Pointing exactly to your Garcar Titan Railway app
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://garcar-titan.up.railway.app/health || echo "404")
          if [ "$STATUS" != "200" ]; then 
            echo "Railway Router Down (Status: $STATUS). Aborting."
            exit 1
          fi
  execute_revenue_machine:
    needs: verify_infrastructure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run revenue-loop.yml --repo Garrettc123/systems-master-hub -f lead_limit=5
