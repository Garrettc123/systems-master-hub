name: Enterprise Control Plane

on:
  workflow_dispatch:
    inputs:
      apply_remediation:
        description: "Apply approved drift remediation"
        required: false
        default: "false"
      deploy_target:
        description: "Target scope (all, vercel, cloudflare, railway)"
        required: false
        default: "all"
  schedule:
    - cron: "15 11 * * *"

permissions:
  contents: read
  actions: read
  id-token: write
  issues: write

concurrency:
  group: enterprise-control-plane-prod
  cancel-in-progress: false

env:
  CI: true

jobs:
  drift-check:
    name: IaC Drift Check
    runs-on: ubuntu-latest
    outputs:
      drift_found: ${{ steps.drift.outputs.drift_found }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: latest

      - name: Init
        run: tofu init -input=false

      - name: Refresh-only drift plan
        id: drift
        shell: bash
        run: |
          set +e
          tofu plan -refresh-only -detailed-exitcode -out=drift.tfplan
          code=$?
          if [ "$code" = "0" ]; then
            echo "drift_found=false" >> "$GITHUB_OUTPUT"
            exit 0
          elif [ "$code" = "2" ]; then
            echo "drift_found=true" >> "$GITHUB_OUTPUT"
            exit 0
          else
            exit "$code"
          fi

      - name: Export drift report
        if: always()
        run: |
          mkdir -p output
          tofu show -no-color drift.tfplan > output/drift-report.txt || true

      - name: Upload drift artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: drift-report
          path: output/drift-report.txt

      - name: Open or update drift issue
        if: steps.drift.outputs.drift_found == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const title = "Drift detected in production infrastructure";
            const body = [
              "Automated drift detection found differences between declared and live infrastructure.",
              "",
              "- Workflow: " + context.workflow,
              "- Run: " + `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              "- Action: review drift artifact, reconcile through code, and re-run.",
            ].join("\n");
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open"
            });
            const existing = issues.data.find(i => i.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body
              });
            }

  secrets-health:
    name: Secrets and Vault Health
    runs-on: ubuntu-latest
    outputs:
      secrets_ok: ${{ steps.vault.outputs.ok }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Vault CLI
        run: |
          curl -fsSL https://releases.hashicorp.com/vault/1.15.4/vault_1.15.4_linux_amd64.zip -o vault.zip
          unzip vault.zip && sudo mv vault /usr/local/bin/

      - name: Validate Vault connectivity and read secrets
        id: vault
        env:
          VAULT_ADDR: ${{ secrets.VAULT_ADDR }}
          VAULT_TOKEN: ${{ secrets.VAULT_TOKEN }}
        run: |
          ok=1
          for path in \
            "secret/data/garcar/vercel" \
            "secret/data/garcar/cloudflare" \
            "secret/data/garcar/railway" \
            "secret/data/garcar/stripe" \
          ; do
            if ! vault kv get -field=token "$path" >/dev/null 2>&1; then
              echo "Missing or unreadable: $path"
              ok=0
            fi
          done
          if [ "$ok" = "1" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi

  deploy-vercel:
    name: Deploy Vercel Frontends
    runs-on: ubuntu-latest
    needs: [drift-check, secrets-health]
    if: needs.secrets-health.outputs.secrets_ok == 'true' && (github.event.inputs.deploy_target == 'all' || github.event.inputs.deploy_target == 'vercel')
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Vercel CLI
        run: npm i -g vercel

      - name: Load Vercel token from Vault
        id: vercel-secret
        env:
          VAULT_ADDR: ${{ secrets.VAULT_ADDR }}
          VAULT_TOKEN: ${{ secrets.VAULT_TOKEN }}
        run: |
          token=$(vault kv get -field=token secret/data/garcar/vercel)
          echo "VERCEL_TOKEN=$token" >> "$GITHUB_OUTPUT"

      - name: Deploy believe-revenue-site
        if: ${{ hashFiles('believe-revenue-site/**') != '' }}
        env:
          VERCEL_TOKEN: ${{ steps.vercel-secret.outputs.VERCEL_TOKEN }}
        run: |
          cd believe-revenue-site && vercel --prod --token "$VERCEL_TOKEN" --yes

      - name: Deploy garcar.io
        if: ${{ hashFiles('garcar.io/**') != '' }}
        env:
          VERCEL_TOKEN: ${{ steps.vercel-secret.outputs.VERCEL_TOKEN }}
        run: |
          cd garcar.io && vercel --prod --token "$VERCEL_TOKEN" --yes

      - name: Deploy ueep
        if: ${{ hashFiles('ueep/**') != '' }}
        env:
          VERCEL_TOKEN: ${{ steps.vercel-secret.outputs.VERCEL_TOKEN }}
        run: |
          cd ueep && vercel --prod --token "$VERCEL_TOKEN" --yes

  deploy-cloudflare:
    name: Deploy Cloudflare Workers
    runs-on: ubuntu-latest
    needs: [drift-check, secrets-health]
    if: needs.secrets-health.outputs.secrets_ok == 'true' && (github.event.inputs.deploy_target == 'all' || github.event.inputs.deploy_target == 'cloudflare')
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Wrangler
        run: npm i -g wrangler

      - name: Load Cloudflare token from Vault
        id: cf-secret
        env:
          VAULT_ADDR: ${{ secrets.VAULT_ADDR }}
          VAULT_TOKEN: ${{ secrets.VAULT_TOKEN }}
        run: |
          token=$(vault kv get -field=api_token secret/data/garcar/cloudflare)
          echo "CF_TOKEN=$token" >> "$GITHUB_OUTPUT"

      - name: Deploy stripe-webhook-worker
        if: ${{ hashFiles('stripe-webhook-worker/**') != '' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ steps.cf-secret.outputs.CF_TOKEN }}
        run: |
          cd stripe-webhook-worker && wrangler deploy

      - name: Deploy agent-api-worker
        if: ${{ hashFiles('agent-api-worker/**') != '' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ steps.cf-secret.outputs.CF_TOKEN }}
        run: |
          cd agent-api-worker && wrangler deploy

      - name: Deploy nexusos-edge
        if: ${{ hashFiles('nexusos-edge/**') != '' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ steps.cf-secret.outputs.CF_TOKEN }}
        run: |
          cd nexusos-edge && wrangler deploy

  deploy-railway:
    name: Deploy Railway Services
    runs-on: ubuntu-latest
    needs: [drift-check, secrets-health]
    if: needs.secrets-health.outputs.secrets_ok == 'true' && (github.event.inputs.deploy_target == 'all' || github.event.inputs.deploy_target == 'railway')
    steps:
      - uses: actions/checkout@v4

      - name: Install Railway CLI
        run: |
          curl -fsSL https://railway.app/install.sh | sh
          echo "$HOME/.railway/bin" >> $GITHUB_PATH

      - name: Load Railway token from Vault
        id: rw-secret
        env:
          VAULT_ADDR: ${{ secrets.VAULT_ADDR }}
          VAULT_TOKEN: ${{ secrets.VAULT_TOKEN }}
        run: |
          token=$(vault kv get -field=token secret/data/garcar/railway)
          echo "RAILWAY_TOKEN=$token" >> "$GITHUB_OUTPUT"

      - name: Deploy outbox-worker
        if: ${{ hashFiles('outbox-worker/**') != '' }}
        env:
          RAILWAY_TOKEN: ${{ steps.rw-secret.outputs.RAILWAY_TOKEN }}
        run: |
          railway up -d outbox-worker

      - name: Deploy rhnes-flywheel
        if: ${{ hashFiles('rhnes-flywheel/**') != '' }}
        env:
          RAILWAY_TOKEN: ${{ steps.rw-secret.outputs.RAILWAY_TOKEN }}
        run: |
          railway up -d rhnes-flywheel

      - name: Deploy durable-event-queue
        if: ${{ hashFiles('durable-event-queue/**') != '' }}
        env:
          RAILWAY_TOKEN: ${{ steps.rw-secret.outputs.RAILWAY_TOKEN }}
        run: |
          railway up -d durable-event-queue

  verify:
    name: Post-deploy Verification
    runs-on: ubuntu-latest
    needs: [deploy-vercel, deploy-cloudflare, deploy-railway]
    if: always()
    steps:
      - name: Health check believe-revenue-site
        run: curl -fsS https://believe-revenue-site.vercel.app/api/health

      - name: Health check garcar.io
        run: curl -fsS https://garcar.io/api/health

      - name: Load Stripe webhook secret from Vault
        id: stripe-secret
        env:
          VAULT_ADDR: ${{ secrets.VAULT_ADDR }}
          VAULT_TOKEN: ${{ secrets.VAULT_TOKEN }}
        run: |
          secret=$(vault kv get -field=webhook_secret secret/data/garcar/stripe)
          echo "STRIPE_WEBHOOK_SECRET=$secret" >> "$GITHUB_OUTPUT"

      - name: Stripe webhook endpoint smoke test
        run: |
          echo "Verify Cloudflare webhook endpoint reachable"
          curl -I -fsS https://stripe-webhook-worker.${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.workers.dev || exit 1

  remediation:
    name: Approved Drift Remediation
    runs-on: ubuntu-latest
    needs: [drift-check]
    if: github.event_name == 'workflow_dispatch' && inputs.apply_remediation == 'true' && needs.drift-check.outputs.drift_found == 'true'
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: latest

      - name: Init
        run: tofu init -input=false

      - name: Apply approved drift plan
        run: tofu apply -input=false -auto-approve drift.tfplan
