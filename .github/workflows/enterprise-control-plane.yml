name: Enterprise Control Plane

on:
  workflow_dispatch:
    inputs:
      deploy_target:
        description: "Deployment target"
        required: false
        default: "none"
        type: choice
        options: [none, all, vercel, cloudflare, railway]
      apply_remediation:
        description: "Apply approved infrastructure remediation"
        required: false
        default: "false"
        type: boolean
  schedule:
    - cron: "15 11 * * *"
  push:
    branches: [main]

permissions:
  contents: read
  issues: write
  actions: read

concurrency:
  group: enterprise-control-plane
  cancel-in-progress: false

env:
  CI: true

jobs:
  preflight:
    name: Control-plane preflight
    runs-on: ubuntu-22.04
    outputs:
      vault_ready: ${{ steps.capabilities.outputs.vault_ready }}
      deploy_requested: ${{ steps.capabilities.outputs.deploy_requested }}
    steps:
      - uses: actions/checkout@v4
      - name: Detect available capabilities
        id: capabilities
        shell: bash
        env:
          VAULT_ADDR: ${{ secrets.VAULT_ADDR }}
          VAULT_TOKEN: ${{ secrets.VAULT_TOKEN }}
        run: |
          vault_ready=false
          if [ -n "$VAULT_ADDR" ] && [ -n "$VAULT_TOKEN" ]; then
            vault_ready=true
          fi
          deploy_requested=false
          target="${{ github.event.inputs.deploy_target || 'none' }}"
          if [ "$target" != "none" ]; then
            deploy_requested=true
          fi
          echo "vault_ready=$vault_ready" >> "$GITHUB_OUTPUT"
          echo "deploy_requested=$deploy_requested" >> "$GITHUB_OUTPUT"
          echo "Vault configured: $vault_ready"
          echo "Deployment requested: $deploy_requested"

  drift-check:
    name: IaC Drift Check
    needs: preflight
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: latest
      - name: Validate IaC without backend credentials
        shell: bash
        run: |
          set -e
          if [ -f main.tf ]; then
            tofu init -backend=false -input=false
            tofu validate
            echo "IaC validation: PASS"
          else
            echo "No root Terraform/OpenTofu configuration; drift check deferred."
          fi

  external-deploy:
    name: External deployment
    needs: preflight
    if: needs.preflight.outputs.vault_ready == 'true' && needs.preflight.outputs.deploy_requested == 'true'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Vault CLI
        shell: bash
        run: |
          curl -fsSL https://releases.hashicorp.com/vault/1.21.1/vault_1.21.1_linux_amd64.zip -o vault.zip
          unzip -q vault.zip
          sudo mv vault /usr/local/bin/vault
      - name: Authenticate and verify required integrations
        id: integrations
        env:
          VAULT_ADDR: ${{ secrets.VAULT_ADDR }}
          VAULT_TOKEN: ${{ secrets.VAULT_TOKEN }}
        shell: bash
        run: |
          set -e
          for path in \
            secret/data/garcar/vercel \
            secret/data/garcar/cloudflare \
            secret/data/garcar/railway \
            secret/data/garcar/stripe; do
            if vault kv get "$path" >/dev/null 2>&1; then
              echo "OK $path"
            else
              echo "Missing integration secret: $path"
              exit 1
            fi
          done
      - name: Deployment boundary
        shell: bash
        run: |
          echo "External deployment credentials are present."
          echo "This job intentionally stops at the verified integration boundary."
          echo "Provider-specific deploy workflows remain the execution layer."

  business-health:
    name: Revenue business health
    needs: [preflight, drift-check]
    runs-on: ubuntu-22.04
    if: always()
    steps:
      - uses: actions/checkout@v4
      - name: Check public business surface
        shell: bash
        run: |
          set -u
          failures=0
          for url in \
            "https://garrettc123.github.io/systems-master-hub" \
            "https://github.com/Garrettc123/garcar-product-factory"; do
            if curl -L --fail --silent --show-error --max-time 20 "$url" >/dev/null; then
              echo "ONLINE $url"
            else
              echo "DEGRADED $url"
              failures=$((failures+1))
            fi
          done
          echo "Business surface failures: $failures"
          if [ "$failures" -gt 0 ]; then
            echo "::warning::One or more public business surfaces are unavailable."
          fi

  summary:
    name: Control-plane summary
    needs: [preflight, drift-check, external-deploy, business-health]
    runs-on: ubuntu-22.04
    if: always()
    steps:
      - name: Report
        shell: bash
        run: |
          echo "PRECHECK   = ${{ needs.preflight.result }}"
          echo "DRIFT      = ${{ needs.drift-check.result }}"
          echo "DEPLOY     = ${{ needs.external-deploy.result }}"
          echo "BUSINESS   = ${{ needs.business-health.result }}"
          if [ "${{ needs.business-health.result }}" = "failure" ]; then
            exit 1
          fi
          echo "CONTROL PLANE COMPLETE"
