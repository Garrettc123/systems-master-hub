# Full End-to-End Automated Terraform Pipeline with Bells & Whistles
# Deploy to AWS via GitHub Actions | Multi-Env | Security | Cost | Alerts | Rollback

name: Terraform Auto-Deploy

on:
  workflow_dispatch:
  pull_request:
    paths: ['terraform/**']

env:
  TF_VERSION: '1.9.5'
  REQUIRED_LABEL: 'approved'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - name: Terraform Format
        run: |
          if [ -d terraform ]; then
            terraform fmt -check -recursive terraform/
          else
            echo "No terraform/ directory — skipping"
          fi
        continue-on-error: true
      - name: Terraform Validate
        run: |
          if [ -d terraform ]; then
            cd terraform && terraform init -backend=false 2>/dev/null || true
            terraform validate
          else
            echo "No terraform/ directory — skipping"
          fi
        continue-on-error: true
      - name: Security Scan (tfsec)
        if: hashFiles('terraform/*.tf') != ''
        uses: aquasecurity/tfsec-action@v1
        with:
          path: terraform/
        continue-on-error: true
      - name: IaC Scan (Checkov)
        if: hashFiles('terraform/*.tf') != ''
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: terraform/
          framework: terraform
        continue-on-error: true

  plan:
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      matrix:
        env: [ dev, staging, prod ]
    permissions:
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - name: Check AWS secrets
        id: check-aws
        env:
          AWS_KEY: ${{ secrets.AWS_ACCESS_KEY_ID }}
        run: |
          if [ -z "$AWS_KEY" ]; then
            echo "⚠️ AWS_ACCESS_KEY_ID not configured — skipping"
            echo "skip=true" >> $GITHUB_OUTPUT
            exit 0
          fi
          echo "skip=false" >> $GITHUB_OUTPUT
      - uses: hashicorp/setup-terraform@v3
        if: steps.check-aws.outputs.skip != 'true'
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - name: Terraform Init
        if: steps.check-aws.outputs.skip != 'true'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          cd terraform
          terraform init -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
                         -backend-config="key=env/${{ matrix.env }}/terraform.tfstate" \
                         -backend-config="region=${{ secrets.AWS_REGION }}" \
                         -backend-config="dynamodb_table=${{ secrets.TF_LOCK_TABLE }}"
      - name: Terraform Plan
        if: steps.check-aws.outputs.skip != 'true'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        id: plan
        run: |
          cd terraform
          terraform plan -var="environment=${{ matrix.env }}" -out=tfplan
        continue-on-error: true
      - name: Cost Estimation (Infracost)
        if: matrix.env == 'prod'
        uses: infracost/actions/infracost@v3
        env:
          INFRACOST_API_KEY: ${{ secrets.INFRACOST_API_KEY }}
        with:
          path: terraform/
          project-id: enterprise-infra
      - name: Update PR Comment (Plan)
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const output = `#### ${{ matrix.env }} Environment Plan 🎯\n${{ steps.plan.outputs.stdout }}`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            });

  apply:
    needs: [plan]
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        env: [ dev, staging, prod ]
    steps:
      - uses: actions/checkout@v4
      - name: Check AWS secrets
        id: check-aws-apply
        env:
          AWS_KEY: ${{ secrets.AWS_ACCESS_KEY_ID }}
        run: |
          if [ -z "$AWS_KEY" ]; then
            echo "⚠️ AWS_ACCESS_KEY_ID not configured — skipping"
            exit 0
          fi
      - uses: hashicorp/setup-terraform@v3
      - name: Terraform Init
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          if [ -z "$AWS_ACCESS_KEY_ID" ]; then exit 0; fi
          cd terraform
          terraform init
      - name: Terraform Apply
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          if [ -z "$AWS_ACCESS_KEY_ID" ]; then exit 0; fi
          cd terraform
          terraform apply -auto-approve tfplan
      - name: Outputs & Slack Alert
        if: success()
        uses: 8398a7/action-slack@v3
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK }}
        with:
          status: ${{ job.status }}
          fields: repo,message,commit,author,action,eventName,ref,workflow,job,took
          text: 'Terraform ✅ Deployed to ${{ matrix.env }}'

  rollback:
    needs: apply
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Auto-Rollback
        run: |
          echo 'Rollback triggered - Restore previous state'
          # Custom rollback logic here
      - uses: 8398a7/action-slack@v3
        if: always()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK }}
        with:
          status: failure
          text: '🚨 Terraform Rollback Executed'

