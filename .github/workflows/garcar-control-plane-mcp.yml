name: Garcar Control Plane MCP CI

on:
  pull_request:
    paths:
      - "mcp/garcar-control-plane/**"
      - ".github/workflows/garcar-control-plane-mcp.yml"
  push:
    branches: [main]
    paths:
      - "mcp/garcar-control-plane/**"
      - ".github/workflows/garcar-control-plane-mcp.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: mcp/garcar-control-plane/pyproject.toml
      - name: Install package and tests
        working-directory: mcp/garcar-control-plane
        run: python -m pip install -e '.[test]'
      - name: Run tests
        working-directory: mcp/garcar-control-plane
        run: pytest -q
