name: Auto-Merge Copilot PRs

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to merge (0 = all eligible)'
        required: false
        default: '0'

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: write
    steps:
      - name: Auto-merge eligible PRs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TARGET="${{ github.event.inputs.pr_number }}"
          if [ "$TARGET" != "0" ] && [ -n "$TARGET" ]; then
            echo "Merging PR #$TARGET..."
            gh pr merge "$TARGET" --repo "${{ github.repository }}" --squash --auto --delete-branch || true
            exit 0
          fi

          echo "Scanning for eligible PRs..."
          OPEN_PRS=$(gh pr list --repo "${{ github.repository }}" --state open \
            --json number,isDraft,mergeable,author,headRefName \
            2>/dev/null || echo '[]')

          echo "$OPEN_PRS" | jq -r '.[] | select(.isDraft == false and .mergeable == "MERGEABLE") | "\(.number) \(.author.login) \(.headRefName)"' | \
          while read PR_NUM AUTHOR BRANCH; do
            echo "PR #$PR_NUM by $AUTHOR ($BRANCH) — enabling auto-merge"
            gh pr merge "$PR_NUM" --repo "${{ github.repository }}" --squash --auto --delete-branch 2>/dev/null || true
          done
