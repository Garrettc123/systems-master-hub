name: Garcar Core CI

on:
  push:
    paths:
      - "revenue/garcar_core/**"
      - "revenue/garcar-core/**"
      - ".github/workflows/garcar-core-ci.yml"
  pull_request:
    paths:
      - "revenue/garcar_core/**"
      - "revenue/garcar-core/**"
      - ".github/workflows/garcar-core-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r revenue/garcar_core/requirements.txt pytest httpx
      - name: Compile
        run: python -m compileall -q revenue/garcar_core
      - name: Test core and phone command center
        run: python -m pytest -q revenue/garcar_core/test_app.py revenue/garcar_core/test_phone_integrations.py
