name: Operator - Manual Run

on:
  workflow_dispatch:
    inputs:
      action:
        description: Read-only operator check to execute
        required: true
        type: choice
        options:
          - validate-all
          - inventory-report
          - check-external-repos
          - security-scan
          - dry-run-deploy

# No deployments, email, payments, account changes, or repository writes.
permissions:
  contents: read

concurrency:
  group: operator-manual-${{ github.ref }}-${{ inputs.action }}
  cancel-in-progress: false

jobs:
  inspect:
    name: Operator / ${{ inputs.action }}
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout only the requested repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: false
      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install YAML parser
        if: inputs.action == 'validate-all'
        run: python -m pip install --disable-pip-version-check 'PyYAML==6.0.2'
      - name: Execute bounded read-only check
        env:
          OPERATOR_ACTION: ${{ inputs.action }}
          GH_TOKEN: ${{ github.token }}
        run: python scripts/operator_manual.py "$OPERATOR_ACTION" --root . --output operator-report
      - name: Preserve sanitized report even when checks fail
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: operator-${{ inputs.action }}-${{ github.run_id }}
          path: operator-report/
          if-no-files-found: warn
          retention-days: 14
