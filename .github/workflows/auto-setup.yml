name: Auto Setup

on:
  workflow_dispatch:

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create Config from secret
        env:
          PIXEL10_SSH_KEY: ${{ secrets.PIXEL10_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          if [ -z "${PIXEL10_SSH_KEY:-}" ]; then
            echo "PIXEL10_SSH_KEY secret is not set. Configure it in repo secrets."
            exit 1
          fi
          printf '%s\n' "$PIXEL10_SSH_KEY" > ~/.ssh/pixel10_key
          chmod 600 ~/.ssh/pixel10_key
          echo "SSH key material loaded from secret"

      - name: Test SSH Connection to Pixel 10
        env:
          PIXEL10_IP: ${{ secrets.PIXEL10_IP }}
          PIXEL10_SSH_PORT: ${{ secrets.PIXEL10_SSH_PORT }}
        run: |
          set -euo pipefail
          IP="${PIXEL10_IP:-100.71.218.79}"
          PORT="${PIXEL10_SSH_PORT:-8022}"
          ssh-keyscan -p "$PORT" "$IP" >> ~/.ssh/known_hosts 2>/dev/null || true
          ssh -i ~/.ssh/pixel10_key \
            -p "$PORT" \
            -o StrictHostKeyChecking=no \
            -o ConnectTimeout=5 \
            "u0_a325@$IP" \
            'echo "Connected as: $(whoami)"' || echo "Connection test finished"

      - name: Deploy Ollama to Pixel 10
        env:
          PIXEL10_IP: ${{ secrets.PIXEL10_IP }}
          PIXEL10_SSH_PORT: ${{ secrets.PIXEL10_SSH_PORT }}
        run: |
          set -euo pipefail
          IP="${PIXEL10_IP:-100.71.218.79}"
          PORT="${PIXEL10_SSH_PORT:-8022}"
          ssh -i ~/.ssh/pixel10_key \
            -p "$PORT" \
            -o StrictHostKeyChecking=no \
            "u0_a325@$IP" 'bash -s' << 'DEPLOY'
          echo "===== PIXEL 10 LLM DEPLOYMENT ====="
          echo "[1/5] Updating packages..."
          pkg update -y 2>/dev/null || true
          pkg install -y curl wget 2>/dev/null || true
          echo "[2/5] Installing Ollama..."
          if ! command -v ollama > /dev/null 2>&1; then
            curl -fsSL https://ollama.ai/install.sh | sh 2>/dev/null || true
          fi
          echo "[3/5] Pulling llama3.2:3b..."
          timeout 1800 ollama pull llama3.2:3b || echo "Download started"
          echo "[4/5] Starting Ollama..."
          nohup ollama serve > /tmp/ollama.log 2>&1 &
          sleep 3
          echo "[5/5] Verifying..."
          curl -s http://127.0.0.1:11434/api/ps 2>/dev/null | head -10 || echo "Service starting"
          echo "===== DEPLOYMENT COMPLETE ====="
          DEPLOY

      - name: Final Check
        env:
          PIXEL10_IP: ${{ secrets.PIXEL10_IP }}
          PIXEL10_SSH_PORT: ${{ secrets.PIXEL10_SSH_PORT }}
        run: |
          set -euo pipefail
          IP="${PIXEL10_IP:-100.71.218.79}"
          PORT="${PIXEL10_SSH_PORT:-8022}"
          sleep 5
          ssh -i ~/.ssh/pixel10_key \
            -p "$PORT" \
            -o StrictHostKeyChecking=no \
            "u0_a325@$IP" \
            'curl -s http://127.0.0.1:11434/api/ps | head -20 || echo Initializing' || true

      - name: Test Model
        env:
          PIXEL10_IP: ${{ secrets.PIXEL10_IP }}
        run: |
          IP="${PIXEL10_IP:-100.71.218.79}"
          curl -X POST "http://$IP:11434/api/generate" \
            -H 'Content-Type: application/json' \
            -d '{"model": "llama3.2:3b", "prompt": "Hello!", "stream": false}' \
            --connect-timeout 5 \
            --max-time 30 || echo "Model still loading"
