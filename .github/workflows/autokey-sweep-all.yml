name: AutoKey → Sweep All Repos

# Master AutoKey sweep: propagates the canonical secret set from systems-master-hub
# to every Tier-1 and Tier-2 repo in registry/repos.json.
#
# Trigger: manual dispatch, or any push that updates the secret registry.
# Source of truth: secrets stored in systems-master-hub.
# Required: GITHUB_PAT (classic PAT, repo + admin:repo_hook scopes) in systems-master-hub secrets.

on:
  workflow_dispatch:
    inputs:
      target_tier:
        description: 'Which tier(s) to sync'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - tier1
          - tier2
          - single
      single_repo:
        description: 'If target_tier=single, enter exact repo name (e.g. garcar-payments)'
        required: false
        default: ''
  push:
    branches: [main]
    paths:
      - 'registry/repos.json'
      - 'vault/**'

concurrency:
  group: autokey-sweep-all
  cancel-in-progress: false

jobs:
  # ──────────────────────────────────────────
  # TIER 1 — Critical revenue & control systems
  # ──────────────────────────────────────────
  sync-garcar-payments:
    name: "→ garcar-payments (Tier 1)"
    runs-on: ubuntu-latest
    if: inputs.target_tier == 'all' || inputs.target_tier == 'tier1' || (inputs.target_tier == 'single' && inputs.single_repo == 'garcar-payments')
    steps:
      - name: Propagate secrets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_PAT }}
          # Supabase
          VAL_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VAL_SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          VAL_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # Stripe
          VAL_STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          VAL_STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          VAL_STRIPE_PUBLISHABLE_KEY: ${{ secrets.STRIPE_PUBLISHABLE_KEY }}
          # Notion
          VAL_NOTION_TOKEN: ${{ secrets.NOTION_API_KEY }}
          VAL_NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          VAL_NOTION_CRM_DB_ID: ${{ secrets.NOTION_CRM_DB_ID }}
          VAL_NOTION_CUSTOMERS_DB_ID: ${{ secrets.NOTION_CUSTOMERS_DB_ID }}
          # Linear
          VAL_LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          VAL_LINEAR_TEAM_ID: ${{ secrets.LINEAR_TEAM_ID }}
          # AI
          VAL_OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          VAL_PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
          # Comms
          VAL_SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
          VAL_SENDGRID_FROM_EMAIL: ${{ secrets.SENDGRID_FROM_EMAIL }}
          VAL_SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          # Shopify
          VAL_SHOPIFY_API_KEY: ${{ secrets.SHOPIFY_API_KEY }}
          VAL_SHOPIFY_API_SECRET: ${{ secrets.SHOPIFY_API_SECRET }}
          VAL_SHOPIFY_STORE_URL: ${{ secrets.SHOPIFY_STORE_URL }}
          VAL_SHOPIFY_ACCESS_TOKEN: ${{ secrets.SHOPIFY_ACCESS_TOKEN }}
          # Infra
          VAL_RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          VAL_APP_URL: ${{ secrets.APP_URL }}
          VAL_GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
          VAL_GITHUB_PAT_DISPATCH: ${{ secrets.GITHUB_PAT_DISPATCH }}
        run: |
          TARGET="Garrettc123/garcar-payments"
          .github/scripts/autokey-push.sh "$TARGET"

  sync-garcar-payment-loop:
    name: "→ garcar-payment-loop (Tier 1)"
    runs-on: ubuntu-latest
    if: inputs.target_tier == 'all' || inputs.target_tier == 'tier1' || (inputs.target_tier == 'single' && inputs.single_repo == 'garcar-payment-loop')
    steps:
      - name: Propagate secrets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_PAT }}
          VAL_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VAL_SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          VAL_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          VAL_STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          VAL_STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          VAL_NOTION_TOKEN: ${{ secrets.NOTION_API_KEY }}
          VAL_NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          VAL_NOTION_CRM_DB_ID: ${{ secrets.NOTION_CRM_DB_ID }}
          VAL_NOTION_CUSTOMERS_DB_ID: ${{ secrets.NOTION_CUSTOMERS_DB_ID }}
          VAL_LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          VAL_LINEAR_TEAM_ID: ${{ secrets.LINEAR_TEAM_ID }}
          VAL_OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          VAL_PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
          VAL_SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
          VAL_SENDGRID_FROM_EMAIL: ${{ secrets.SENDGRID_FROM_EMAIL }}
          VAL_SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          VAL_SHOPIFY_API_KEY: ${{ secrets.SHOPIFY_API_KEY }}
          VAL_SHOPIFY_ACCESS_TOKEN: ${{ secrets.SHOPIFY_ACCESS_TOKEN }}
          VAL_SHOPIFY_STORE_URL: ${{ secrets.SHOPIFY_STORE_URL }}
          VAL_RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          VAL_GITHUB_PAT_DISPATCH: ${{ secrets.GITHUB_PAT_DISPATCH }}
        run: |
          TARGET="Garrettc123/garcar-payment-loop"
          .github/scripts/autokey-push.sh "$TARGET"

  sync-mars-api:
    name: "→ mars-api (Tier 1)"
    runs-on: ubuntu-latest
    if: inputs.target_tier == 'all' || inputs.target_tier == 'tier1' || (inputs.target_tier == 'single' && inputs.single_repo == 'mars-api')
    steps:
      - uses: actions/checkout@v4
      - name: Propagate secrets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_PAT }}
          VAL_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VAL_SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          VAL_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          VAL_LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          VAL_LINEAR_TEAM_ID: ${{ secrets.LINEAR_TEAM_ID }}
          VAL_OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          VAL_RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          VAL_STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          VAL_NOTION_TOKEN: ${{ secrets.NOTION_API_KEY }}
          VAL_SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
          VAL_SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          TARGET="Garrettc123/mars-api"
          .github/scripts/autokey-push.sh "$TARGET"

  sync-enterprise-mlops:
    name: "→ enterprise-mlops-platform (Tier 1)"
    runs-on: ubuntu-latest
    if: inputs.target_tier == 'all' || inputs.target_tier == 'tier1' || (inputs.target_tier == 'single' && inputs.single_repo == 'enterprise-mlops-platform')
    steps:
      - uses: actions/checkout@v4
      - name: Propagate secrets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_PAT }}
          VAL_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VAL_SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          VAL_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          VAL_RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          VAL_OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          VAL_LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          VAL_NOTION_TOKEN: ${{ secrets.NOTION_API_KEY }}
        run: |
          TARGET="Garrettc123/enterprise-mlops-platform"
          .github/scripts/autokey-push.sh "$TARGET"

  # ──────────────────────────────────────────
  # TIER 2 — Core operational systems
  # ──────────────────────────────────────────
  sync-titan:
    name: "→ TITAN-Autonomous-Business-Empire (Tier 2)"
    needs: [sync-garcar-payments, sync-garcar-payment-loop]
    runs-on: ubuntu-latest
    if: |
      always() &&
      (inputs.target_tier == 'all' || inputs.target_tier == 'tier2' ||
       (inputs.target_tier == 'single' && inputs.single_repo == 'TITAN-Autonomous-Business-Empire'))
    steps:
      - uses: actions/checkout@v4
      - name: Propagate secrets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_PAT }}
          VAL_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VAL_SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          VAL_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          VAL_STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          VAL_STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          VAL_LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          VAL_LINEAR_TEAM_ID: ${{ secrets.LINEAR_TEAM_ID }}
          VAL_OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          VAL_PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
          VAL_NOTION_TOKEN: ${{ secrets.NOTION_API_KEY }}
          VAL_SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
          VAL_SHOPIFY_API_KEY: ${{ secrets.SHOPIFY_API_KEY }}
          VAL_SHOPIFY_ACCESS_TOKEN: ${{ secrets.SHOPIFY_ACCESS_TOKEN }}
          VAL_RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          VAL_SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          TARGET="Garrettc123/TITAN-Autonomous-Business-Empire"
          .github/scripts/autokey-push.sh "$TARGET"

  sync-atlas-dashboard:
    name: "→ atlas-dashboard (Tier 2)"
    needs: [sync-garcar-payments]
    runs-on: ubuntu-latest
    if: |
      always() &&
      (inputs.target_tier == 'all' || inputs.target_tier == 'tier2' ||
       (inputs.target_tier == 'single' && inputs.single_repo == 'atlas-dashboard'))
    steps:
      - uses: actions/checkout@v4
      - name: Propagate secrets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_PAT }}
          VAL_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VAL_SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          VAL_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          VAL_VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VAL_STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          VAL_LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          VAL_NOTION_TOKEN: ${{ secrets.NOTION_API_KEY }}
        run: |
          TARGET="Garrettc123/atlas-dashboard"
          .github/scripts/autokey-push.sh "$TARGET"

  sync-zeus-dashboard:
    name: "→ zeus-dashboard (Tier 2)"
    needs: [sync-garcar-payments]
    runs-on: ubuntu-latest
    if: |
      always() &&
      (inputs.target_tier == 'all' || inputs.target_tier == 'tier2' ||
       (inputs.target_tier == 'single' && inputs.single_repo == 'zeus-dashboard'))
    steps:
      - uses: actions/checkout@v4
      - name: Propagate secrets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_PAT }}
          VAL_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VAL_SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          VAL_VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VAL_LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          VAL_LINEAR_TEAM_ID: ${{ secrets.LINEAR_TEAM_ID }}
          VAL_NOTION_TOKEN: ${{ secrets.NOTION_API_KEY }}
          VAL_OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          VAL_SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          TARGET="Garrettc123/zeus-dashboard"
          .github/scripts/autokey-push.sh "$TARGET"

  sync-atlas-orchestration:
    name: "→ atlas-orchestration (Tier 2)"
    needs: [sync-garcar-payments]
    runs-on: ubuntu-latest
    if: |
      always() &&
      (inputs.target_tier == 'all' || inputs.target_tier == 'tier2' ||
       (inputs.target_tier == 'single' && inputs.single_repo == 'atlas-orchestration'))
    steps:
      - uses: actions/checkout@v4
      - name: Propagate secrets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_PAT }}
          VAL_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VAL_SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          VAL_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          VAL_STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          VAL_LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          VAL_LINEAR_TEAM_ID: ${{ secrets.LINEAR_TEAM_ID }}
          VAL_OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          VAL_NOTION_TOKEN: ${{ secrets.NOTION_API_KEY }}
          VAL_SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
          VAL_SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          VAL_RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          TARGET="Garrettc123/atlas-orchestration"
          .github/scripts/autokey-push.sh "$TARGET"

  # Also sync the staging/prod pipeline repo
  sync-autonomous-deploy:
    name: "→ autonomous-zero-touch-deploy"
    needs: [sync-garcar-payments]
    runs-on: ubuntu-latest
    if: |
      always() &&
      (inputs.target_tier == 'all' ||
       (inputs.target_tier == 'single' && inputs.single_repo == 'autonomous-zero-touch-deploy'))
    steps:
      - uses: actions/checkout@v4
      - name: Propagate secrets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_PAT }}
          VAL_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VAL_SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          VAL_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          VAL_STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          VAL_STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          VAL_LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          VAL_LINEAR_TEAM_ID: ${{ secrets.LINEAR_TEAM_ID }}
          VAL_NOTION_TOKEN: ${{ secrets.NOTION_API_KEY }}
          VAL_NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          VAL_OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          VAL_PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
          VAL_SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
          VAL_VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VAL_SHOPIFY_API_KEY: ${{ secrets.SHOPIFY_API_KEY }}
          VAL_SHOPIFY_ACCESS_TOKEN: ${{ secrets.SHOPIFY_ACCESS_TOKEN }}
          VAL_SHOPIFY_STORE_URL: ${{ secrets.SHOPIFY_STORE_URL }}
          VAL_SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          VAL_GITHUB_PAT_DISPATCH: ${{ secrets.GITHUB_PAT_DISPATCH }}
        run: |
          TARGET="Garrettc123/autonomous-zero-touch-deploy"
          .github/scripts/autokey-push.sh "$TARGET"

  sync-garcar-operator-fabric:
    name: "→ garcar-operator-fabric"
    needs: [sync-garcar-payments]
    runs-on: ubuntu-latest
    if: |
      always() &&
      (inputs.target_tier == 'all' ||
       (inputs.target_tier == 'single' && inputs.single_repo == 'garcar-operator-fabric'))
    steps:
      - uses: actions/checkout@v4
      - name: Propagate secrets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_PAT }}
          VAL_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VAL_SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          VAL_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          VAL_STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          VAL_STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          VAL_STRIPE_PUBLISHABLE_KEY: ${{ secrets.STRIPE_PUBLISHABLE_KEY }}
          VAL_LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          VAL_LINEAR_TEAM_ID: ${{ secrets.LINEAR_TEAM_ID }}
          VAL_NOTION_TOKEN: ${{ secrets.NOTION_API_KEY }}
          VAL_NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          VAL_NOTION_CRM_DB_ID: ${{ secrets.NOTION_CRM_DB_ID }}
          VAL_NOTION_CUSTOMERS_DB_ID: ${{ secrets.NOTION_CUSTOMERS_DB_ID }}
          VAL_OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          VAL_PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
          VAL_SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
          VAL_SENDGRID_FROM_EMAIL: ${{ secrets.SENDGRID_FROM_EMAIL }}
          VAL_SHOPIFY_API_KEY: ${{ secrets.SHOPIFY_API_KEY }}
          VAL_SHOPIFY_API_SECRET: ${{ secrets.SHOPIFY_API_SECRET }}
          VAL_SHOPIFY_ACCESS_TOKEN: ${{ secrets.SHOPIFY_ACCESS_TOKEN }}
          VAL_SHOPIFY_STORE_URL: ${{ secrets.SHOPIFY_STORE_URL }}
          VAL_RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          VAL_SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          VAL_GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
          VAL_GITHUB_PAT_DISPATCH: ${{ secrets.GITHUB_PAT_DISPATCH }}
        run: |
          TARGET="Garrettc123/garcar-operator-fabric"
          .github/scripts/autokey-push.sh "$TARGET"

  # ──────────────────────────────────────────
  # SWEEP SUMMARY
  # ──────────────────────────────────────────
  sweep-summary:
    name: Sweep Summary
    needs:
      - sync-garcar-payments
      - sync-garcar-payment-loop
      - sync-mars-api
      - sync-enterprise-mlops
      - sync-titan
      - sync-atlas-dashboard
      - sync-zeus-dashboard
      - sync-atlas-orchestration
      - sync-autonomous-deploy
      - sync-garcar-operator-fabric
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Write sweep summary
        uses: actions/github-script@v7
        with:
          script: |
            const results = {
              'garcar-payments':                    '${{ needs.sync-garcar-payments.result }}',
              'garcar-payment-loop':                '${{ needs.sync-garcar-payment-loop.result }}',
              'mars-api':                           '${{ needs.sync-mars-api.result }}',
              'enterprise-mlops-platform':          '${{ needs.sync-enterprise-mlops.result }}',
              'TITAN-Autonomous-Business-Empire':   '${{ needs.sync-titan.result }}',
              'atlas-dashboard':                    '${{ needs.sync-atlas-dashboard.result }}',
              'zeus-dashboard':                     '${{ needs.sync-zeus-dashboard.result }}',
              'atlas-orchestration':                '${{ needs.sync-atlas-orchestration.result }}',
              'autonomous-zero-touch-deploy':       '${{ needs.sync-autonomous-deploy.result }}',
              'garcar-operator-fabric':             '${{ needs.sync-garcar-operator-fabric.result }}'
            }
            const icon = r => r === 'success' ? '✅' : r === 'skipped' ? '⏭️' : '❌'
            const lines = Object.entries(results).map(([repo, r]) => `| ${icon(r)} | \`${repo}\` | ${r} |`)
            const failed = Object.values(results).filter(r => r === 'failure').length
            const summary = [
              '## 🔑 AutoKey Sweep Complete',
              '',
              '| | Repo | Result |',
              '|---|---|---|',
              ...lines,
              '',
              failed > 0
                ? `> ⚠️ **${failed} repo(s) failed.** Check individual job logs above. Missing secrets in systems-master-hub are the most common cause.`
                : '> ✅ **All repos synced successfully.**'
            ].join('\n')
            await core.summary.addRaw(summary).write()
            console.log(summary)
