name: AutoKey → Sweep All Repos

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type SYNC to propagate secrets to all repos'
        required: true
        default: ''
        type: string
      target_repo:
        description: 'Optional single repo name (e.g. garcar-payments)'
        required: false
        default: ''
        type: string
      dry_run:
        description: 'Set true to preview without writing secrets'
        required: false
        default: 'false'
        type: string
      include_archived:
        description: 'Include archived repositories'
        required: false
        default: 'false'
        type: string
      include_forks:
        description: 'Include fork repositories'
        required: false
        default: 'false'
        type: string
  push:
    branches: [main]
    paths:
      - '.github/workflows/autokey-sweep-all.yml'
      - '.github/scripts/autokey-*.sh'

concurrency:
  group: autokey-sweep-all
  cancel-in-progress: false

jobs:
  sweep:
    name: Sync secrets across repositories
    if: github.event_name != 'workflow_dispatch' || inputs.confirm == 'SYNC'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Verify sync prerequisites
        env:
          GH_TOKEN: ${{ secrets.GHPAT || secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN}" ]; then
            echo "❌ Missing auth token. Set GHPAT or PAT_TOKEN in systems-master-hub secrets."
            exit 1
          fi
          echo "✅ Auth token is configured"

      - name: Sync configured secrets to every selected repository
        env:
          GH_TOKEN: ${{ secrets.GHPAT || secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
          GITHUB_OWNER: Garrettc123
          TARGET_REPO: ${{ inputs.target_repo }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
          INCLUDE_ARCHIVED: ${{ inputs.include_archived || 'false' }}
          INCLUDE_FORKS: ${{ inputs.include_forks || 'false' }}
          VAL_APOLLO_API_KEY: ${{ secrets.APOLLO_API_KEY }}
          VAL_ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          VAL_APP_BASE_URL_ATLAS: ${{ secrets.APP_BASE_URL_ATLAS }}
          VAL_APP_BASE_URL_PAYMENTS: ${{ secrets.APP_BASE_URL_PAYMENTS }}
          VAL_APP_BASE_URL_RHNS: ${{ secrets.APP_BASE_URL_RHNS }}
          VAL_APP_BASE_URL_ZEUS: ${{ secrets.APP_BASE_URL_ZEUS }}
          VAL_APP_URL: ${{ secrets.APP_URL }}
          VAL_CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          VAL_CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          VAL_DATABASE_URL: ${{ secrets.DATABASE_URL }}
          VAL_GC_PAT_DISPATCH: ${{ secrets.GC_PAT_DISPATCH }}
          VAL_GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          VAL_GHPAT: ${{ secrets.GHPAT }}
          VAL_GITHUB_PAT_DISPATCH: ${{ secrets.GITHUB_PAT_DISPATCH }}
          VAL_GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          VAL_GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
          VAL_HUBSPOT_API_KEY: ${{ secrets.HUBSPOT_API_KEY }}
          VAL_LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          VAL_LINEAR_TEAM_ID: ${{ secrets.LINEAR_TEAM_ID }}
          VAL_NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
          VAL_NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          VAL_NOTION_CRM_DB_ID: ${{ secrets.NOTION_CRM_DB_ID }}
          VAL_NOTION_CUSTOMERS_DB_ID: ${{ secrets.NOTION_CUSTOMERS_DB_ID }}
          VAL_NOTION_TOKEN: ${{ secrets.NOTION_API_KEY }}
          VAL_OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          VAL_PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
          VAL_PIXEL10_IP: ${{ secrets.PIXEL10_IP }}
          VAL_PIXEL10_SSH_KEY: ${{ secrets.PIXEL10_SSH_KEY }}
          VAL_PIXEL10_SSH_PORT: ${{ secrets.PIXEL10_SSH_PORT }}
          VAL_RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          VAL_REDIS_URL: ${{ secrets.REDIS_URL }}
          VAL_SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
          VAL_SENDGRID_FROM_EMAIL: ${{ secrets.SENDGRID_FROM_EMAIL }}
          VAL_SHOPIFY_ACCESS_TOKEN: ${{ secrets.SHOPIFY_ACCESS_TOKEN }}
          VAL_SHOPIFY_API_KEY: ${{ secrets.SHOPIFY_API_KEY }}
          VAL_SHOPIFY_API_SECRET: ${{ secrets.SHOPIFY_API_SECRET }}
          VAL_SHOPIFY_STORE_URL: ${{ secrets.SHOPIFY_STORE_URL }}
          VAL_SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          VAL_STRIPE_PRICE_AGENCY: ${{ secrets.STRIPE_PRICE_AGENCY }}
          VAL_STRIPE_PRICE_PRO: ${{ secrets.STRIPE_PRICE_PRO }}
          VAL_STRIPE_PRICE_STARTER: ${{ secrets.STRIPE_PRICE_STARTER }}
          VAL_STRIPE_PUBLISHABLE_KEY: ${{ secrets.STRIPE_PUBLISHABLE_KEY }}
          VAL_STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          VAL_STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          VAL_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          VAL_SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          VAL_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          VAL_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VAL_VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          chmod +x .github/scripts/autokey-push.sh .github/scripts/autokey-sync-all.sh
          .github/scripts/autokey-sync-all.sh

      - name: Write summary
        if: always()
        run: |
          {
            echo "## 🔑 AutoKey Sweep Summary"
            echo ""
            echo "- Owner: \`Garrettc123\`"
            echo "- Target repo input: \`${{ inputs.target_repo || 'all repositories' }}\`"
            echo "- Dry run: \`${{ inputs.dry_run || 'false' }}\`"
            echo "- Include archived: \`${{ inputs.include_archived || 'false' }}\`"
            echo "- Include forks: \`${{ inputs.include_forks || 'false' }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
