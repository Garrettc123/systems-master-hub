name: 🏆 Prestige Quality Check

on:
  schedule:
    - cron: '0 0 * * 0'  # Weekly on Sunday
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prestige-orchestrator:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f prestige-automation/requirements.txt ]; then
            pip install -r prestige-automation/requirements.txt
          else
            echo "::warning::prestige-automation/requirements.txt not found — skipping pip install"
          fi

      - name: Run Prestige Orchestrator
        run: |
          if [ -f prestige-automation/MASTER_ORCHESTRATOR.py ]; then
            cd prestige-automation && python3 MASTER_ORCHESTRATOR.py
          else
            echo "::warning::MASTER_ORCHESTRATOR.py not found — skipping"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prestige-reports
          path: |
            PRESTIGE_STATUS_REPORT.md
            PRESTIGE_ACTION_PLAN.md
            QUICK_WINS.md
            prestige_data.json
            prestige_orchestrator.log
          retention-days: 30
          
      - name: 📊 Create Summary
        if: always()
        run: |
          echo "## 🏆 Prestige Check Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Reports generated:" >> $GITHUB_STEP_SUMMARY
          echo "- 📋 PRESTIGE_STATUS_REPORT.md" >> $GITHUB_STEP_SUMMARY
          echo "- 🎯 PRESTIGE_ACTION_PLAN.md" >> $GITHUB_STEP_SUMMARY
          echo "- ⚡ QUICK_WINS.md" >> $GITHUB_STEP_SUMMARY
          echo "- 📊 prestige_data.json" >> $GITHUB_STEP_SUMMARY
