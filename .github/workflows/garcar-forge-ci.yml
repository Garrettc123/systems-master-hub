name: Garcar Forge CI

on:
  pull_request:
    paths:
      - "garcar-forge/**"
      - ".github/workflows/garcar-forge-ci.yml"
  push:
    branches: [main]
    paths:
      - "garcar-forge/**"
      - ".github/workflows/garcar-forge-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: garcar-forge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Local CI suite
        run: ./scripts/ci.sh
      - name: End-to-end API and worker smoke test
        run: ./scripts/e2e-smoke.sh
