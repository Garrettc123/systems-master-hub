name: Garcar Forge CI

on:
  pull_request:
    paths:
      - "garcar-forge/**"
      - ".github/workflows/garcar-forge-ci.yml"
  push:
    branches: [main]
    paths:
      - "garcar-forge/**"
      - ".github/workflows/garcar-forge-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: garcar-forge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Compile
        run: python -m compileall -q app tests
      - name: Lint
        run: ruff check app tests
      - name: Test
        run: pytest
