name: Deploy - Full Stack (Manual)

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - staging
          - prod

env:
  INPUT_ENVIRONMENT: ${{ github.event.inputs.environment }}
  TF_VERSION: '1.9.5'
  NODE_VERSION: '18'
  PYTHON_VERSION: '3.11'

permissions:
  contents: read

jobs:
  #############################################################################
  # PHASE 1: Auto-Detect Environment
  #############################################################################
  detect-env:
    name: 'Detect Environment'
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.detect.outputs.environment }}
    steps:
      - id: detect
        run: |
          ENV="${INPUT_ENVIRONMENT}"
          echo "environment=$ENV" >> $GITHUB_OUTPUT
          echo "Deploying to: $ENV"

  #############################################################################
  # PHASE 2: Initialize & Setup
  #############################################################################
  initialize:
    name: 'Initialize Environment'
    needs: detect-env
    runs-on: ubuntu-latest
    outputs:
      timestamp: ${{ steps.timestamp.outputs.timestamp }}
      has_aws: ${{ steps.check-secrets.outputs.has_aws }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: timestamp
        run: echo "timestamp=$(date +%Y%m%d_%H%M%S)" >> $GITHUB_OUTPUT
      - name: Check for AWS secrets
        id: check-secrets
        run: |
          if [ -n "${{ secrets.AWS_ACCESS_KEY_ID }}" ]; then
            echo "has_aws=true" >> $GITHUB_OUTPUT
          else
            echo "has_aws=false" >> $GITHUB_OUTPUT
            echo "::warning::AWS secrets not configured — skipping AWS-dependent steps"
          fi
      - name: Configure AWS
        if: steps.check-secrets.outputs.has_aws == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: echo "${{ needs.detect-env.outputs.environment }} environment ready"

  #############################################################################
  # PHASE 3: Deploy Universal Workflows (13 Repos)
  #############################################################################
  resolve-targets:
    name: 'Resolve Targets'
    needs: detect-env
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.resolve.outputs.matrix }}
      count: ${{ steps.resolve.outputs.count }}
    steps:
      - uses: actions/checkout@v4
      # Repo names live in registry/repos.json, never in this workflow.
      - id: resolve
        run: python3 scripts/resolve_deploy_targets.py --all > /dev/null

  deploy-workflows:
    name: '🔧 Deploy Workflows'
    needs: [initialize, detect-env, resolve-targets]
    if: needs.resolve-targets.outputs.count != '0'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.resolve-targets.outputs.matrix) }}
      max-parallel: 5
    steps:
      - name: "Deploy CI to ${{ matrix.name }}"
        env:
          TARGET_REPO: ${{ matrix.repo }}
          # GITHUB_TOKEN cannot write to other repositories; a PAT is required.
          GH_PAT: ${{ secrets.GARCAR_PAT || secrets.PAT_TOKEN || secrets.GHPAT }}
        run: |
          set -euo pipefail

          if [ -z "$GH_PAT" ]; then
            echo "::warning::No cross-repo PAT configured; skipping $TARGET_REPO"
            exit 0
          fi

          # Credential helper keeps the token out of the remote URL, out of
          # argv, and out of .git/config.
          git config --global credential.helper \
            '!f() { printf "username=x-access-token\npassword=%s\n" "$GH_PAT"; }; f'
          git config --global user.name "Garrett Automation"
          git config --global user.email "automation@garrettc123.dev"

          workdir=$(mktemp -d)
          git clone --depth 1 "https://github.com/${TARGET_REPO}.git" "$workdir/repo"
          cd "$workdir/repo"
          mkdir -p .github/workflows

          cat > .github/workflows/ci.yml << 'WORKFLOW'
          name: CI/CD
          on: [push, pull_request]
          permissions:
            contents: read
          jobs:
            ci:
              runs-on: ubuntu-latest
              strategy:
                matrix:
                  node-version: [18.x, 20.x]
              steps:
                - uses: actions/checkout@v4
                - uses: actions/setup-node@v4
                  with:
                    node-version: ${{ '${{' }} matrix.node-version }}
                - uses: actions/setup-python@v5
                  with:
                    python-version: '3.11'
                - run: |
                    if [ -f package.json ]; then npm ci; fi
                    if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
                - run: |
                    if [ -f Makefile ]; then make test; fi
                    if [ -f pytest.ini ]; then pytest; fi
                    if [ -f package.json ]; then npm test 2>/dev/null || true; fi
                - run: |
                    if [ -f Makefile ]; then make build; fi
                    if [ -f package.json ]; then npm run build 2>/dev/null || true; fi
          WORKFLOW

          git add .github/workflows/ci.yml
          if git diff --cached --quiet; then
            echo "$TARGET_REPO already up to date"
            exit 0
          fi

          git commit -m "🔧 Auto: Deploy universal CI/CD"
          branch=$(git rev-parse --abbrev-ref HEAD)
          # Report a real failure instead of masking it with `|| true`, so a
          # broken rollout is visible rather than silently skipped.
          if ! git push origin "HEAD:${branch}"; then
            echo "::error::Failed to push CI workflow to ${TARGET_REPO} (${branch})"
            exit 1
          fi
          echo "updated $TARGET_REPO ($branch)"

  #############################################################################
  # PHASE 4: Terraform Validation
  #############################################################################
  terraform-validate:
    name: 'Terraform Validation'
    needs: initialize
    if: needs.initialize.outputs.has_aws == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: |
          if [ -d terraform ]; then
            cd terraform && terraform init -upgrade 2>/dev/null || true
            terraform validate 2>/dev/null || true
          else
            echo "No terraform/ directory found — skipping"
          fi
      - name: 'tfsec Security Scan'
        if: hashFiles('terraform/*.tf') != ''
        uses: aquasecurity/tfsec-action@v1
        with:
          path: terraform/
        continue-on-error: true

  terraform-plan:
    name: 'Terraform Plan'
    needs: [initialize, terraform-validate, detect-env]
    if: needs.initialize.outputs.has_aws == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}
      - name: 'Terraform Init & Plan'
        run: |
          cd terraform
          terraform init -upgrade 2>/dev/null || true
          terraform plan -var="environment=${{ needs.detect-env.outputs.environment }}" -out=tfplan 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ needs.detect-env.outputs.environment }}
          path: terraform/tfplan
        continue-on-error: true

  terraform-apply:
    name: 'Terraform Apply'
    needs: [terraform-plan, detect-env]
    if: needs.terraform-plan.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}
      - name: 'Terraform Init & Apply'
        run: |
          cd terraform
          terraform init -upgrade 2>/dev/null || true
          terraform apply -auto-approve -var="environment=${{ needs.detect-env.outputs.environment }}" 2>/dev/null || true
      - name: 'Capture Outputs'
        run: |
          cd terraform
          terraform output -json > outputs.json 2>/dev/null || echo '{}' > outputs.json
      - uses: actions/upload-artifact@v4
        with:
          name: tf-outputs-${{ needs.detect-env.outputs.environment }}
          path: terraform/outputs.json
        continue-on-error: true

  #############################################################################
  # PHASE 7: Vercel Deployment
  #############################################################################
  vercel-deploy:
    name: 'Vercel Deploy'
    needs: [initialize, detect-env]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: 'Deploy to Vercel'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::warning::VERCEL_TOKEN not set — skipping Vercel deploy"
            exit 0
          fi
          npm install -g vercel
          vercel --prod --token="$VERCEL_TOKEN" 2>/dev/null || true
        continue-on-error: true

  finalize:
    name: 'Reports & Summary'
    needs: [initialize, deploy-workflows, terraform-apply, vercel-deploy, detect-env]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: 'Generate Summary'
        run: |
          echo "# Full Stack Deploy Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Environment**: ${{ needs.detect-env.outputs.environment }}" >> $GITHUB_STEP_SUMMARY
          echo "**Status**: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "**Timestamp**: ${{ needs.initialize.outputs.timestamp }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Phase | Result |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Initialize | ${{ needs.initialize.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Deploy Workflows | ${{ needs.deploy-workflows.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Terraform Apply | ${{ needs.terraform-apply.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Vercel Deploy | ${{ needs.vercel-deploy.result }} |" >> $GITHUB_STEP_SUMMARY
