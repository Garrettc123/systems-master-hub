name: Deploy - All Systems Status

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  preflight:
    name: Pre-flight checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate hub structure
        run: |
          ERRORS=0
          for f in docker-compose.yml Makefile SYSTEMS-INVENTORY.json README.md; do
            [ -f "$f" ] && echo "OK  $f" || { echo "MISSING $f"; ERRORS=$((ERRORS+1)); }
          done
          if [ "$ERRORS" -gt 0 ]; then
            echo "::error::Hub structure incomplete — $ERRORS file(s) missing"
            exit 1
          fi

      - name: Validate workflows
        run: |
          pip install pyyaml -q
          ERRORS=0
          for f in .github/workflows/*.yml; do
            python3 -c "import yaml; yaml.safe_load(open('$f'))" 2>/dev/null \
              && echo "OK  $(basename $f)" \
              || { echo "ERR $(basename $f)"; ERRORS=$((ERRORS+1)); }
          done
          [ "$ERRORS" -eq 0 ] || { echo "::error::$ERRORS workflow(s) have YAML errors"; exit 1; }

  inventory:
    name: Systems inventory
    runs-on: ubuntu-latest
    needs: preflight
    steps:
      - uses: actions/checkout@v4

      - name: Generate systems report
        run: |
          python3 << 'PYEOF'
          import json, os

          inv = json.load(open("SYSTEMS-INVENTORY.json"))
          ov = inv.get("overview", {})
          cats = inv.get("categories", {})

          print("=" * 50)
          print(" SYSTEMS MASTER HUB — STATUS REPORT")
          print("=" * 50)
          print(f" Owner:           {ov.get('owner', 'N/A')}")
          print(f" Total repos:     {ov.get('total_repositories', 'N/A')}")
          print(f" Production:      {ov.get('production_systems', 'N/A')}")
          print(f" Last updated:    {ov.get('last_updated', 'N/A')}")
          print()

          total_systems = 0
          for cat_name, systems in cats.items():
              total_systems += len(systems)
              print(f" [{cat_name}] — {len(systems)} system(s)")
              for sys_name, sys_data in systems.items():
                  status = sys_data.get("status", "unknown")
                  url = sys_data.get("repo_url", "")
                  print(f"   - {sys_name}: {status}")

          print()
          print(f" Total systems tracked: {total_systems}")
          print("=" * 50)
          PYEOF

  check-repos:
    name: Verify repo accessibility
    runs-on: ubuntu-latest
    needs: preflight
    steps:
      - uses: actions/checkout@v4

      - name: Check repos from inventory
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ACCESSIBLE=0; FAILED=0
          python3 -c "
          import json
          inv = json.load(open('SYSTEMS-INVENTORY.json'))
          for cat in inv.get('categories', {}).values():
            for sys in cat.values():
              url = sys.get('repo_url', '')
              if url: print(url)
          " | sort -u | while read url; do
            repo=$(echo "$url" | sed 's|https://github.com/||')
            if gh repo view "$repo" --json name -q '.name' >/dev/null 2>&1; then
              echo "OK  $repo"
            else
              echo "SKIP $repo (private or not accessible with default token)"
            fi
          done

  compose-check:
    name: Validate Docker Compose
    runs-on: ubuntu-latest
    needs: preflight
    steps:
      - uses: actions/checkout@v4

      - name: Validate compose config
        run: |
          echo "=== Docker Compose Services ==="
          docker compose config --services 2>/dev/null | while read svc; do
            echo "  - $svc"
          done || echo "WARN: compose config requires build contexts"

          echo ""
          echo "=== Service count ==="
          COUNT=$(docker compose config --services 2>/dev/null | wc -l || echo 0)
          echo "  $COUNT service(s) declared"

  summary:
    name: Deployment readiness summary
    runs-on: ubuntu-latest
    needs: [preflight, inventory, check-repos, compose-check]
    if: always()
    steps:
      - name: Summary
        run: |
          echo "============================================"
          echo " ALL SYSTEMS STATUS — $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "============================================"
          echo " Preflight:   ${{ needs.preflight.result }}"
          echo " Inventory:   ${{ needs.inventory.result }}"
          echo " Repo Check:  ${{ needs.check-repos.result }}"
          echo " Compose:     ${{ needs.compose-check.result }}"
          echo "============================================"
          if [ "${{ needs.preflight.result }}" = "failure" ]; then
            echo "::error::Preflight checks failed — fix hub structure before deploying"
            exit 1
          fi
