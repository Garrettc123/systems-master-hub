name: Deploy - All Systems Status

on:
  workflow_dispatch:
  push:
    branches: [main]

# Runner fallback: pin to Ubuntu 22.04 to avoid transient ubuntu-latest runner
# provisioning failures. This workflow is status/readiness only; it does not
# mutate external systems.
jobs:
  preflight:
    name: Pre-flight checks
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Validate hub structure
        run: |
          for f in docker-compose.yml Makefile SYSTEMS-INVENTORY.json README.md; do
            [ -f "$f" ] && echo "OK  $f" || { echo "WARN $f missing"; }
          done
      - name: Validate workflows
        run: |
          python3 -m pip install pyyaml -q
          errors=0
          for f in .github/workflows/*.yml; do
            python3 -c "import yaml; yaml.safe_load(open('$f'))" 2>/dev/null \
              && echo "OK  $(basename "$f")" \
              || { echo "ERR $(basename "$f")"; errors=$((errors+1)); }
          done
          if [ "$errors" -gt 0 ]; then
            echo "::warning::$errors workflow file(s) could not be parsed"
          fi

  inventory:
    name: Systems inventory
    runs-on: ubuntu-22.04
    needs: preflight
    steps:
      - uses: actions/checkout@v4
      - name: Generate systems report
        run: |
          python3 << 'PYEOF'
          import json
          inv = json.load(open("SYSTEMS-INVENTORY.json"))
          ov = inv.get("overview", {})
          cats = inv.get("categories", {})
          print("SYSTEMS MASTER HUB — STATUS REPORT")
          print(f"Owner: {ov.get('owner', 'N/A')}")
          print(f"Total repos: {ov.get('total_repositories', 'N/A')}")
          print(f"Production: {ov.get('production_systems', 'N/A')}")
          print(f"Last updated: {ov.get('last_updated', 'N/A')}")
          print(f"Categories: {len(cats)}")
          print(f"Systems tracked: {sum(len(v) for v in cats.values())}")
          PYEOF

  check-repos:
    name: Verify repo accessibility
    runs-on: ubuntu-22.04
    needs: preflight
    steps:
      - uses: actions/checkout@v4
      - name: Check repos from inventory
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY' | sort -u | while read -r url; do
          import json
          inv=json.load(open('SYSTEMS-INVENTORY.json'))
          for cat in inv.get('categories',{}).values():
            for sys in cat.values():
              if sys.get('repo_url'): print(sys['repo_url'])
          PY
            repo="${url#https://github.com/}"
            if gh repo view "$repo" --json name -q '.name' >/dev/null 2>&1; then
              echo "OK  $repo"
            else
              echo "SKIP $repo (not accessible with default token)"
            fi
          done

  compose-check:
    name: Validate Docker Compose
    runs-on: ubuntu-22.04
    needs: preflight
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose config
        run: |
          if docker compose config --services >/tmp/services 2>/dev/null; then
            echo "$(wc -l </tmp/services) service(s) declared"
            cat /tmp/services
          else
            echo "WARN: compose config unavailable; readiness check continues"
          fi

  summary:
    name: Deployment readiness summary
    runs-on: ubuntu-22.04
    needs: [preflight, inventory, check-repos, compose-check]
    if: always()
    steps:
      - name: Summary
        run: |
          echo "ALL SYSTEMS STATUS — $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "Preflight:  ${{ needs.preflight.result }}"
          echo "Inventory:  ${{ needs.inventory.result }}"
          echo "Repo Check: ${{ needs.check-repos.result }}"
          echo "Compose:    ${{ needs.compose-check.result }}"
          if [ "${{ needs.preflight.result }}" = "failure" ]; then
            echo "::warning::Preflight runner/check failed; status workflow completed via fallback."
          fi
