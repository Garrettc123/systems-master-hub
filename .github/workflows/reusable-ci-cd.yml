name: Reusable CI/CD Pipeline

on:
  workflow_call:
    inputs:
      stack:
        required: true
        type: string
      environment:
        required: false
        type: string
        default: 'staging'

permissions:
  contents: read

jobs:
  quality:
    name: Code Quality & Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Environment
        uses: actions/setup-node@v4
        if: inputs.stack == 'node'
        with:
          node-version: '20'
          
      - name: Setup Python
        uses: actions/setup-python@v5
        if: inputs.stack == 'python'
        with:
          python-version: '3.11'

      - name: Run Linting
        run: |
          if [ "${INPUT_STACK}" == "node" ]; then npm install && npm run lint; fi
          if [ "${INPUT_STACK}" == "python" ]; then pip install flake8 && flake8 .; fi

  test:
    name: Automated Testing
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Tests
        run: |
          if [ "${INPUT_STACK}" == "node" ]; then npm test; fi
          if [ "${INPUT_STACK}" == "python" ]; then pip install pytest && pytest; fi

  deploy:
    name: Deployment
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Deploy to ${{ inputs.environment }}
        run: echo "Deploying system to ${INPUT_ENVIRONMENT}..."

env:
  INPUT_ENVIRONMENT: ${{ inputs.environment }}
  INPUT_STACK: ${{ inputs.stack }}
