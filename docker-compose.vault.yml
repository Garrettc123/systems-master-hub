# Garcar Enterprise — Local / Dev HashiCorp Vault
# Usage:
#   docker compose -f docker-compose.vault.yml up -d
#   export VAULT_ADDR=http://127.0.0.1:8200
#   export VAULT_TOKEN=garcar-dev-root-token
#   bash vault/hashicorp/bootstrap.sh

services:
  vault:
    image: hashicorp/vault:1.17
    container_name: garcar-vault
    ports:
      - "8200:8200"
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: "garcar-dev-root-token"
      VAULT_DEV_LISTEN_ADDRESS: "0.0.0.0:8200"
      VAULT_ADDR: "http://0.0.0.0:8200"
    cap_add:
      - IPC_LOCK
    command: server -dev -dev-root-token-id=garcar-dev-root-token
    healthcheck:
      test: ["CMD", "vault", "status", "-address=http://127.0.0.1:8200"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - garcar-vault-data:/vault/data

volumes:
  garcar-vault-data:
