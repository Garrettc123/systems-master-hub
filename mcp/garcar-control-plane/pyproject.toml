[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "garcar-control-plane-mcp"
version = "0.1.0"
description = "Governed MCP control plane for Garcar Enterprise"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["mcp>=1.9,<2"]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.scripts]
garcar-control-plane-mcp = "garcar_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
