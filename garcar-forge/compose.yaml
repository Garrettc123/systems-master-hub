services:
  forge-control:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: garcar-forge-control
    restart: unless-stopped
    env_file:
      - .env
    environment:
      GARCAR_LEDGER_PATH: /data/garcar-forge.sqlite3
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - forge-ledger:/data
    read_only: true
    tmpfs:
      - /tmp:size=32m,noexec,nosuid
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/readyz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  forge-ledger:
