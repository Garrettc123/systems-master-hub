version: "1.0"
name: garcar-unified-os
source_of_truth: systems-master-hub
status_semantics:
  design: planned or conceptual
  development: actively being built
  validated: CI/tests or equivalent evidence passed
  deployed: deployment evidence exists
  observed: runtime health evidence exists
  degraded: deployed but unhealthy
  retired: intentionally decommissioned
confidence_semantics:
  verified: backed by operational evidence
  partially_verified: some evidence, incomplete coverage
  claimed: documentation claim not independently verified

